name: SDD Continuous Drift Detection

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      feature:
        description: 'Feature a verificar (001 o 002). Vacío = 001.'
        required: false
        default: '001'

env:
  # Multi-feature (T205): la 001 es el valor por defecto (también en la ejecución programada).
  FEATURE: ${{ inputs.feature || '001' }}

jobs:
  drift-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit Spec-to-Contract-to-Code Lineage
        run: |
          bash scripts/compile-contracts.sh --feature "$FEATURE"
          git diff --exit-code src/generated/
          bash scripts/verify-traceability.sh --feature "$FEATURE"
          bash scripts/verify-oracles.sh --feature "$FEATURE"
