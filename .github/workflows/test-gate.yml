name: SDD Test Gate (The Architecture Type System)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Compuerta por tarea (TASK-NNN). Vacío = compuerta final con todos los IDs vigentes.'
        required: false
        default: ''

env:
  SEMGREP_VERSION: '1.184.0'

jobs:
  test-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Contract Compilation & Zero Generated Drift (INV-ARCH-003)
        run: |
          bash scripts/compile-contracts.sh
          git diff --exit-code src/generated/

      - name: Verify Traceability & Layer Purity (INV-ARCH-001 / INV-ARCH-002 / INV-ARCH-006)
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: |
          if [[ -n "$TASK_ID" ]]; then
            bash scripts/verify-traceability.sh --task "$TASK_ID"
          else
            bash scripts/verify-traceability.sh
          fi

      - name: Verify Test Oracles (Zero Weak Oracles)
        run: bash scripts/verify-oracles.sh

      - name: Setup Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: SAST (Semgrep fijado por versión; reglas en tests/security/sast-rules/)
        run: |
          python -m pip install "semgrep==${SEMGREP_VERSION}"
          semgrep --version
          if find tests/security/sast-rules -type f \( -name '*.yml' -o -name '*.yaml' \) | grep -q .; then
            semgrep scan --config tests/security/sast-rules --error --metrics=off src/
          else
            echo "[SDD SAST] Sin reglas en tests/security/sast-rules/ (se crean en TASK-113); Semgrep instalado y sin análisis."
          fi

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run Unit, Property-Based & Contract Integration Tests
        run: npm test

      - name: Run Mutation Testing Gate (Stryker, break 85)
        run: npm run test:mutation
