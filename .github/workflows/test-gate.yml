name: SDD Test Gate (The Architecture Type System)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Compuerta por tarea (TASK-NNN). Vacío = compuerta final completa (npm run test:gate).'
        required: false
        default: ''

env:
  SEMGREP_VERSION: '1.184.0'

jobs:
  test-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Playwright y los nombres de archivo con tildes necesitan UTF-8 (H-115-4).
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Contract Compilation & Zero Generated Drift (INV-ARCH-003)
        run: |
          bash scripts/compile-contracts.sh
          git diff --exit-code src/generated/

      - name: Compuerta por tarea (solo con task_id)
        if: ${{ inputs.task_id != '' }}
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: bash scripts/verify-traceability.sh --task "$TASK_ID"

      - name: Setup Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: SAST (Semgrep fijado por versión; reglas en tests/security/sast-rules/)
        run: |
          python -m pip install "semgrep==${SEMGREP_VERSION}"
          semgrep --version
          semgrep scan --config tests/security/sast-rules --error --metrics=off src/

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Compuerta final completa (npm run test:gate)
        if: ${{ inputs.task_id == '' }}
        run: npm run test:gate
