openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Argos Pet Health & Biometric Tracker API - delta de la feature 006 (escena del hogar)
  version: 3.7.0
  description: >
    Documento INCREMENTAL de la feature 006: contiene solo las operaciones nuevas; los OpenAPI de la 004 (3.2.0) y de la 005
    (3.3.0) permanecen sin cambio. Todas las operaciones son autenticadas (cookie + cabecera X-Argos-Request en las que modifican
    estado), salvo /internal/scene-worker, que usa OIDC de la cuenta de servicio de Cloud Tasks. La generacion es ASINCRONA: la
    peticion de generar responde de inmediato (<= 1 s) con el estado y el cliente consulta por sondeo (REQ-ESC6-019,
    NFR-ESC6-002, NFR-ESC6-003). El cliente NUNCA envia el modo, las referencias ni el prompt: el servidor decide el modo y arma
    el payload (REQ-ESC6-006, REQ-ESC6-015). Un usuario sin acceso al hogar recibe el 404 de ERR-HOUSE-NOT-FOUND (INV-ESC6-007);
    quien ve pero no puede escribir recibe 403 ERR-ACC-FORBIDDEN (D6-10 = B). Errores en application/problem+json (RFC 9457);
    los codigos nuevos viven en contracts/errors/error-catalog.json (incremental).
    Revision 2 (2026-11-18): el estado de la escena se DERIVA en lectura; las mutaciones y la generacion tienen limites de tasa (429
    ERR-RATE-LIMITED heredado de 004, REQ-ESC6-034); la Idempotency-Key tiene alcance (actor, escena, accion), vigencia de 24 h y solo se recuerda la ultima clave de la escena
    (REQ-ESC6-012); el parametro v de las imagenes es SOLO una etiqueta de cache (INV-ESC6-019); /internal/scene-worker exige
    audiencia propia y correo exacto de la cuenta de servicio (REQ-ESC6-033). Las respuestas 302 de escena y foto comparten
    Cache-Control no-store, Referrer-Policy no-referrer y X-Content-Type-Options nosniff.
  x-sdd-status: DRAFT
  x-sdd-metadata:
    version: 3.7.0
    status: DRAFT
    supersedes: 3.5.0
    change_type: MINOR
    change_note: "3.7.0 (feature 006, enmienda 2026-11-24, Neo Nivel 2, Architect, MINOR aditiva, REQ-ESC6-039, INV-ESC6-021): SceneView (scene.schema.json 1.3.0) gana el valor blockedReason = GLOBAL_QUOTA_EXHAUSTED y los dos POST de generacion (generateHouseholdScene, generateOwnerScene) documentan 409 ERR-SCENE-GLOBAL-QUOTA-EXHAUSTED (catalogo 1.2.0) cuando la cuota global mensual de la plataforma esta agotada: sin intento, sin consumo de cuota del hogar y sin llamada al generador; se evalua despues de autorizacion, ERR-SCENE-DISABLED, consentimiento y cuota del hogar, y antes de los limites de tasa. Ninguna operacion ni ruta nueva; el 429 y Retry-After no cambian (REQ-ESC6-034: enfriamiento 0 s tras FAILED/CANCELLED, solo tras SUCCEEDED aplican 60 s). Antes: 3.6.0 (feature 009, T1257, Architect 2026-11-23, MINOR aditiva, REQ-CFG9-003, EDGE-009-019): SceneView (scene.schema.json 1.2.0) gana la propiedad opcional disabled y los dos POST de generacion (generateHouseholdScene, generateOwnerScene) documentan 409 ERR-SCENE-DISABLED (catalogo 1.1.0) cuando scene.enabled = false: sin intento, sin cuota y sin llamada al generador; se evalua tras la autorizacion y antes de consentimiento, cuota y limites de tasa. Los GET devuelven la escena con disabled = true y la imagen vigente sigue disponible. Ninguna operacion ni ruta nueva; un cliente 3.5.0 ignora el campo. CORRECCION de la nota de la alineacion T912 en 3.5.0: la frase «se mantiene en 3.4.0» se reescribio como «era entonces 3.4.0» y ya no contradice la cabecera. 3.5.0 (feature 008, #54, Caso B confirmado en Chromium, Architect 2026-11-20, MINOR aditiva): getHouseholdSceneImage y getOwnerSceneImage aceptan el parametro de consulta opcional download (enum [\"1\"]). Con download=1 la URL firmada V4 se emite con response-content-disposition attachment y filename fijo argos-hogar-AAAA-MM-DD.png (fecha de generacion de la imagen vigente en APP_TIMEZONE, sin nombre de mascota ni de hogar) y el 302 sigue igual; con un driver sin URL firmada la ruta responde 200 con el cuerpo de la imagen y Content-Disposition attachment. Sin download todo es identico a 3.4.0 (inline). download NO selecciona imagen (INV-ESC6-019): solo cambia el tratamiento del archivo; la URL firmada y el nombre no se registran. Ninguna operacion, ruta ni codigo nuevo. Antes: 3.4.0 (feature 006, MINOR aditiva, Architect 2026-11-18): 13 operaciones nuevas, ninguna existente cambia. Escena del hogar y de propietario sin hogar (D6-09), generacion asincrona con arrendamiento, foto del hogar por cuerpo crudo como en 004 (D-18), consentimiento y su retiro con purga (D6-16, D6-17) y worker interno de Cloud Tasks (D6-15). La API NO expone el prompt ni el payload (INV-ESC6-010). Revision 2 (2026-11-18): sin operaciones nuevas; 429 en las 6 operaciones que cambian estado o cuestan; etiqueta de cache UUID en lugar de entero; sin compilar todavia. Alineacion 2026-11-19 (T912, N2-14): SceneView.actions gana retryAfterSeconds (integer|null, 1..86400, opcional) por el $ref a scene.schema.json 1.1.0; ninguna operacion, ruta ni cabecera cambia y la cabecera Retry-After del 429 no cambia; la version del documento era entonces 3.4.0 (DRAFT, fijada en codigo y pruebas); la 3.5.0 de esta cabecera la sustituye (la frase «se mantiene en 3.4.0» quedo obsoleta, corregida en 3.6.0, T1257)."
    traceability: [REQ-CFG9-003, EDGE-009-019, REQ-ESC6-001, REQ-ESC6-003, REQ-ESC6-004, REQ-ESC6-005, REQ-ESC6-007, REQ-ESC6-011, REQ-ESC6-012, REQ-ESC6-013, REQ-ESC6-019, REQ-ESC6-020, REQ-ESC6-021, REQ-ESC6-023, REQ-ESC6-024, REQ-ESC6-025, REQ-ESC6-026, REQ-ESC6-029, REQ-ESC6-032, INV-ESC6-003, INV-ESC6-004, INV-ESC6-007, INV-ESC6-014, EDGE-ESC6-016, EDGE-ESC6-024, REQ-ESC6-033, REQ-ESC6-034, REQ-ESC6-036, INV-ESC6-018, INV-ESC6-019, SC-ESC6-077, SC-ESC6-079, SC-ESC6-080, SC-ESC6-081, SC-ESC6-093]
servers:
  - url: http://127.0.0.1:3100/api
    description: Servidor local (prefijo /api)
security:
  - sessionCookie: []
tags:
  - name: scene
  - name: household-photo
  - name: scene-consent
  - name: scene-internal

paths:
  /households/{householdId}/scene:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
    get:
      tags: [scene]
      operationId: getHouseholdScene
      summary: "Estado de la escena del hogar: estado, cambios pendientes, cuota, acciones habilitadas y consentimiento [REQ-ESC6-003, REQ-ESC6-005, REQ-ESC6-011, REQ-ESC6-019]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ESC6-003, REQ-ESC6-004, REQ-ESC6-005, REQ-ESC6-008, REQ-ESC6-011, REQ-ESC6-019, REQ-ESC6-020]
      x-sdd-rbac-action: "READ_SCENE (acceso de lectura al hogar o a alguna de sus mascotas, INV-ACC2-001)"
      description: >
        PRIMERO autoriza y responde 404 sin escribir nada: no se crean filas para hogares ajenos ni inexistentes (INV-ESC6-019).
        Despues crea la fila de la escena de forma perezosa y evalua el arrendamiento: si vencio, lo materializa como failed
        con un compare-and-set idempotente, sin consumir cuota (EDGE-ESC6-003). El estado (idle, outdated, ready) se DERIVA
        en cada lectura (data-model.md §4). El cliente la sondea cada 3 s (constante del cliente) mientras status = generating.
        Cache-Control: no-store.
      responses:
        '200':
          description: "Vista de la escena"
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '../schemas/scene.schema.json#/$defs/SceneView' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /households/{householdId}/scene/generate:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
    post:
      tags: [scene]
      operationId: generateHouseholdScene
      summary: "Generar la imagen del hogar: desde cero (REGENERATE, la accion del boton unico de la UI) o incremental (UPDATE, solo API directa); asincrono e idempotente [REQ-ESC6-005, REQ-ESC6-007, REQ-ESC6-012]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ESC6-005, REQ-ESC6-006, REQ-ESC6-007, REQ-ESC6-011, REQ-ESC6-012, REQ-ESC6-014, REQ-ESC6-020, REQ-ESC6-023, REQ-ESC6-024, INV-ESC6-003, INV-ESC6-004, INV-ESC6-014, EDGE-ESC6-016]
      x-sdd-rbac-action: "GENERATE_SCENE (propietario del hogar o ADMIN, D6-10 = B)"
      description: >
        Bajo el candado de la escena y en una transaccion: valida rol, consentimiento (driver real), cuota y condiciones del boton;
        decide el modo; fija el arrendamiento (T_LEASE = 150 s), la huella y el intento; registra la fila INTENT del objeto
        resultante; encola la tarea (Cloud Tasks o Job, D6-15) y responde en <= 1 s. La generacion corre en /internal/scene-worker.
        Sin cambios pendientes y con UPDATE: responde 200 con el estado SIN invocar al generador (D14, SC-ESC6-014). Si ya esta
        generating: 200 con el estado vigente, sin segunda generacion ni descuento (D16). Misma Idempotency-Key = misma respuesta.
        action = REGENERATE (la que envia siempre el boton unico de la UI desde D6-21) esta disponible sin cambios pendientes (REQ-ESC6-007) y exige la misma cuota y rol; action = UPDATE (incremental) queda solo para la API directa. Idempotency-Key
        con alcance (actor, escena, accion), vigencia de 24 h y memoria de la ULTIMA clave de la escena (una clave anterior no se reconoce y la peticion es nueva): la misma clave con otra accion es 422; una clave ya consumida
        por un intento terminal devuelve 200 con el estado vigente y no bloquea un intento nuevo con clave nueva; la respuesta
        repetida se reevalua en permisos (quien ya no tiene acceso recibe 404, no la respuesta almacenada). Enfriamiento de 60 s
        entre intentos y topes de intentos por escena y por actor: 429 ERR-RATE-LIMITED con Retry-After (REQ-ESC6-034). El
        consentimiento se comprueba tambien en el worker y en T2 (REQ-ESC6-036). Con la funcion deshabilitada por el administrador (scene.enabled = false, feature 009) y tras
        autorizar (404/403), responde 409 ERR-SCENE-DISABLED ANTES de consentimiento, cuota y limites de tasa: no crea intento, no consume cuota ni
        llama al generador; una generacion ya en curso termina (D9-16 = A) y SceneView.disabled = true.
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/scene.schema.json#/$defs/GenerateSceneInput' }
      responses:
        '202':
          description: "Generacion aceptada; status = generating"
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '../schemas/scene.schema.json#/$defs/SceneView' }
        '200':
          description: "Sin cambios pendientes, ya generating o reintento idempotente: estado vigente sin nueva llamada ni descuento"
          content:
            application/json:
              schema: { $ref: '../schemas/scene.schema.json#/$defs/SceneView' }
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: "ERR-ACC-FORBIDDEN (rol sin permiso) o ERR-SCENE-CONSENT-REQUIRED (consentimiento vigente ausente; 0 llamadas al generador, INV-ESC6-014) o ERR-AUTH-CSRF-REJECTED"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: "ERR-SCENE-QUOTA-EXCEEDED (cuota mensual agotada; la imagen vigente se conserva, D6-05) o ERR-SCENE-DISABLED (scene.enabled = false: sin intento ni cuota; la imagen vigente se conserva, REQ-CFG9-003) o ERR-SCENE-GLOBAL-QUOTA-EXHAUSTED (cuota global mensual de la plataforma agotada: sin intento, sin cuota del hogar, sin llamada al generador; la imagen vigente se conserva, REQ-ESC6-039)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Problem' }

  /households/{householdId}/scene/image:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
    get:
      tags: [scene]
      operationId: getHouseholdSceneImage
      summary: "Imagen vigente de la escena por URL firmada V4 [REQ-ESC6-019, INV-ESC6-007]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ESC6-019, REQ-ESC6-020, INV-ESC6-007, RR-06-05]
      x-sdd-rbac-action: "READ_SCENE"
      description: "TTL de ARGOS_MEDIA_SIGNED_URL_TTL_SECONDS (300 s, techo 900; sin ampliarlo). Sin imagen vigente y sin acceso al hogar responden el mismo 404 de ERR-HOUSE-NOT-FOUND, con cuerpo, instance y cabeceras identicos (INV-ESC6-007; Decision de Fase 6, 2026-11-18: sustituye ERR-MEDIA-NOT-FOUND para no crear un oraculo entre «sin imagen» y «sin acceso»). Cache-Control: no-store. La URL no se registra."
      parameters:
        - name: v
          in: query
          required: false
          description: "imageTag de SceneView; SOLO etiqueta de cache (INV-ESC6-019): el servidor resuelve siempre la imagen vigente de la escena autorizada, nunca por v; un v distinto de la vigente se ignora o da 404"
          schema: { $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/Uuid' }
        - name: download
          in: query
          required: false
          description: "Solo el valor 1 (cualquier otro es 422 ERR-SCHEMA-VALIDATION-FAILED). Pide la imagen vigente como archivo: la URL firmada fija response-content-disposition attachment y filename argos-hogar-AAAA-MM-DD.png (AAAA-MM-DD = fecha de generacion en APP_TIMEZONE; sin PII); con driver sin URL firmada se responde 200 con Content-Disposition attachment. No elige imagen (INV-ESC6-019)"
          schema: { type: string, enum: ['1'] }
      responses:
        '200': { $ref: '#/components/responses/ImageAttachment' }
        '302': { $ref: '#/components/responses/SignedRedirect' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /households/{householdId}/photo:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
    put:
      tags: [household-photo]
      operationId: putHouseholdPhoto
      summary: "Sube o reemplaza la foto de referencia del hogar (cuerpo crudo) [REQ-ESC6-001, REQ-ESC6-020]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ESC6-001, REQ-ESC6-018, REQ-ESC6-020, INV-ESC6-009, REQ-ARC-001, INV-ARC-001, INV-ARC-002]
      x-sdd-rbac-action: "GENERATE_SCENE (propietario del hogar o ADMIN, D6-10 = B)"
      description: >
        Misma validacion que REQ-ARC-001 de 004 (lectura en streaming con tope ARGOS_MEDIA_MAX_BYTES, tipo por firma, JPEG, PNG
        o WebP; SVG y HTML rechazados), ANTES de almacenar y de enviar a la IA. Sin cabecera de nombre: el nombre del archivo no
        se guarda (INV-ESC6-009). Rechaza ancho x alto > 25 MP o lado > 8192 px leyendo IHDR/SOF/VP8X, ANTES de almacenar (REQ-ESC6-027). Limite de tasa por usuario (REQ-ESC6-034). Cuenta en la cuota de 1 GiB del propietario del hogar. Reemplazar o borrar deja la escena
        outdated con 1 cambio pendiente y encola la clave anterior para borrado.
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: "Foto vigente"
          content:
            application/json:
              schema: { $ref: '../schemas/scene.schema.json#/$defs/HouseholdPhotoView' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/Problem' }
    get:
      tags: [household-photo]
      operationId: getHouseholdPhoto
      summary: "Foto del hogar por URL firmada V4 [REQ-ESC6-001, INV-ESC6-007]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ESC6-001, REQ-ESC6-020, INV-ESC6-007]
      x-sdd-rbac-action: "READ_SCENE"
      responses:
        '302': { $ref: '#/components/responses/SignedRedirect' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [household-photo]
      operationId: deleteHouseholdPhoto
      summary: "Borra la foto del hogar (idempotente) [REQ-ESC6-001, REQ-ESC6-029]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ESC6-001, REQ-ESC6-029]
      x-sdd-rbac-action: "GENERATE_SCENE"
      description: "204 idempotente con cola transaccional (el objeto se encola en la misma transaccion, REQ-GCS-004); sin periodo de gracia."
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: "Sin foto del hogar" }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/scene:
    get:
      tags: [scene]
      operationId: getOwnerScene
      summary: "Escena del propietario sin hogar explicito [REQ-ESC6-032, REQ-ESC6-019]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ESC6-032, REQ-ESC6-019, REQ-ESC6-020]
      x-sdd-rbac-action: "READ_SCENE (propia)"
      description: "Disponible mientras el usuario no haya creado su primer hogar como propietario; despues migra al hogar sin consumir cuota (D6-09 = A). 404 ERR-HOUSE-NOT-FOUND si la escena ya migro."
      responses:
        '200':
          description: "Vista de la escena"
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '../schemas/scene.schema.json#/$defs/SceneView' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /me/scene/generate:
    post:
      tags: [scene]
      operationId: generateOwnerScene
      summary: "Generar la escena del propietario sin hogar, desde cero (REGENERATE) o incremental (UPDATE, solo API directa) [REQ-ESC6-005, REQ-ESC6-032]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ESC6-005, REQ-ESC6-007, REQ-ESC6-011, REQ-ESC6-012, REQ-ESC6-032, REQ-ESC6-039]
      x-sdd-rbac-action: "GENERATE_SCENE (propietario)"
      description: "Mismo comportamiento que generateHouseholdScene (incluido 409 ERR-SCENE-DISABLED con la funcion deshabilitada, REQ-CFG9-003) (mismo manejador parametrizado por ambito), con REGENERATE como accion del boton unico de la UI (D6-21) y UPDATE solo por API directa; el ambito de la cuota es el propietario."
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/scene.schema.json#/$defs/GenerateSceneInput' }
      responses:
        '202':
          description: "Generacion aceptada"
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '../schemas/scene.schema.json#/$defs/SceneView' }
        '200':
          description: "Sin cambios, ya generating o reintento idempotente"
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '../schemas/scene.schema.json#/$defs/SceneView' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/scene/image:
    get:
      tags: [scene]
      operationId: getOwnerSceneImage
      summary: "Imagen vigente de la escena del propietario por URL firmada V4 [REQ-ESC6-019]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ESC6-019, REQ-ESC6-032]
      x-sdd-rbac-action: "READ_SCENE (propia)"
      parameters:
        - name: v
          in: query
          required: false
          description: "imageTag de SceneView; SOLO etiqueta de cache (INV-ESC6-019)"
          schema: { $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/Uuid' }
        - name: download
          in: query
          required: false
          description: "Solo el valor 1 (cualquier otro es 422 ERR-SCHEMA-VALIDATION-FAILED). Pide la imagen vigente como archivo: la URL firmada fija response-content-disposition attachment y filename argos-hogar-AAAA-MM-DD.png (AAAA-MM-DD = fecha de generacion en APP_TIMEZONE; sin PII); con driver sin URL firmada se responde 200 con Content-Disposition attachment. No elige imagen (INV-ESC6-019)"
          schema: { type: string, enum: ['1'] }
      responses:
        '200': { $ref: '#/components/responses/ImageAttachment' }
        '302': { $ref: '#/components/responses/SignedRedirect' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /scene-consent/notice:
    get:
      tags: [scene-consent]
      operationId: getSceneNotice
      summary: "Version vigente del aviso, proveedor y alcances [REQ-ESC6-026]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ESC6-023, REQ-ESC6-026]
      x-sdd-rbac-action: "autenticado"
      responses:
        '200':
          description: "Clave de version del aviso y proveedor vigentes; el texto lo sirve el cliente"
          content:
            application/json:
              schema: { $ref: '../schemas/scene.schema.json#/$defs/SceneNotice' }
        '401': { $ref: '#/components/responses/Problem' }

  /scene-consent:
    post:
      tags: [scene-consent]
      operationId: grantSceneConsent
      summary: "Registra el consentimiento del usuario (version del aviso, proveedor, alcances) [REQ-ESC6-023, REQ-ESC6-024]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ESC6-023, REQ-ESC6-024, REQ-ESC6-026, INV-ESC6-014, EDGE-ESC6-018]
      x-sdd-rbac-action: "autenticado (consiente solo por sus propios datos, D6-16 = A)"
      description: >
        Idempotente por (usuario, alcance, proveedor, version). Si noticeVersion o providerId no son los vigentes: 409
        ERR-SCENE-NOTICE-OUTDATED. Consentir o retirar puede cambiar la huella efectiva de escenas ajenas y las deja outdated; NO consume cuota del hogar ni fuerza REGENERATE. Limite de tasa por usuario (REQ-ESC6-034); el evento de auditoria lleva el actorId opaco.
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/scene.schema.json#/$defs/GrantSceneConsentInput' }
      responses:
        '204': { description: "Consentimiento vigente" }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [scene-consent]
      operationId: revokeSceneConsent
      summary: "Retira el consentimiento y purga las imagenes derivadas de los datos del usuario [REQ-ESC6-025, REQ-ESC6-029]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ESC6-025, REQ-ESC6-029, REQ-ESC6-030, INV-ESC6-014]
      x-sdd-rbac-action: "autenticado"
      description: >
        Idempotente. En una transaccion: revoked_at en sus consentimientos; encola el borrado inmediato (media_deletion_queue) de la
        foto del hogar que haya subido y de la imagen vigente de toda escena cuyas fuentes lo incluyan (D6-17 = A); las escenas
        quedan outdated o idle; el boton Actualizar queda deshabilitado para el usuario hasta un nuevo consentimiento. No toca el
        avatar de la mascota (dato de la mascota) ni el resto de la aplicacion. Los intentos en vuelo cuyos datos retira pasan a CANCELLED (EDGE-ESC6-025). El proveedor puede conservar datos ya enviados (RR-06-11).
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: "Consentimiento retirado e imagenes encoladas para borrado" }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /internal/scene-worker:
    post:
      tags: [scene-internal]
      operationId: runSceneWorker
      summary: "Ejecuta un intento de generacion; invocado solo por Cloud Tasks con OIDC [NFR-ESC6-002, EDGE-ESC6-024]"
      x-sdd-change: NEW
      x-sdd-requirements: [NFR-ESC6-002, REQ-ESC6-011, REQ-ESC6-012, REQ-ESC6-013, REQ-ESC6-014, REQ-ESC6-027, INV-ESC6-003, INV-ESC6-005, EDGE-ESC6-024]
      x-sdd-internal: true
      description: >
        Sin cookie ni CSRF. Autenticada por el token OIDC de la cuenta de servicio de Cloud Tasks con AUDIENCIA PROPIA (la URL
        de ARGOS_SCENE_WORKER_URL, distinta de la de /internal/maintenance) y correo EXACTAMENTE igual a
        ARGOS_SCENE_TASKS_SA_EMAIL, ademas de iss, exp y email_verified (REQ-ESC6-033). Cloud Run es publico: esta verificacion es
        la unica barrera. Se verifica ANTES de parsear el cuerpo, que tiene tope de 1 KiB. 401: sin token, token invalido o
        audiencia equivocada. 403: audiencia correcta y correo distinto (incluida la identidad de Scheduler), sin cuerpo ni
        detalle. El cuerpo solo lleva IDs opacos; si el attemptId no pertenece al sceneId, o la escena o el intento no existen, o
        el intento ya termino, o el claim PENDING -> RUNNING no se gana, responde 204 sin efecto, sin llamar al generador ni
        descontar cuota y sin mensaje distinto (sin oraculo; entrega al-menos-una-vez, EDGE-ESC6-024/027). Tras el claim el
        arrendamiento se cuenta desde claimed_at (EDGE-ESC6-026). Llama al generador con AbortSignal de T_GEN (90 s), valida la
        salida por firma (REQ-ESC6-035) y publica en una transaccion T2 que recomprueba consentimiento y asignacion de los
        duenos de datos (EDGE-ESC6-025). Un fallo del generador NO devuelve 5xx a la cola (el intento queda registrado failed;
        maxAttempts = 1): 204 siempre que la tarea se proceso. La URL de destino de la tarea sale solo de configuracion
        validada (INV-ESC6-018). Rutas internas: 401/403 sin cuerpo del proveedor.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/scene.schema.json#/$defs/SceneWorkerTask' }
      responses:
        '204': { description: "Tarea procesada (exito, fallo registrado, duplicado ignorado, escena o intento inexistente)" }
        '401': { description: "Sin token, token invalido o audiencia equivocada; sin cuerpo" }
        '403': { description: "Audiencia correcta y correo distinto del esperado; sin cuerpo" }
        '422': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argos_session
      description: Cookie de sesion de la 002/004 (HttpOnly, SameSite=Strict). /internal/scene-worker declara security [] y valida OIDC.
  headers:
    NoStore:
      description: "Cache-Control: no-store"
      schema: { type: string, const: 'no-store' }
    NoReferrer:
      description: "Referrer-Policy: no-referrer"
      schema: { type: string, const: 'no-referrer' }
    NoSniff:
      description: "X-Content-Type-Options: nosniff"
      schema: { type: string, const: 'nosniff' }
    RetryAfter:
      description: "Segundos hasta el proximo intento permitido"
      schema: { type: integer, minimum: 1 }
  parameters:
    CsrfHeader:
      name: X-Argos-Request
      in: header
      required: true
      description: Obligatoria en toda peticion autenticada que modifica estado; si falta, ERR-AUTH-CSRF-REJECTED.
      schema: { type: string, const: '1' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "UUID v4 generado por el cliente una vez por intento y reutilizado en cada reintento (EDGE-ESC6-016). Ausente o mal formado = 422 ERR-SCHEMA-VALIDATION-FAILED. El servidor guarda solo su SHA-256."
      schema: { $ref: '../schemas/scene.schema.json#/$defs/IdempotencyKey' }
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema: { $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/Uuid' }
  responses:
    RateLimited:
      description: "ERR-RATE-LIMITED (heredado de 004): limite de tasa por usuario o de intentos por escena/actor, o enfriamiento (REQ-ESC6-034)"
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    SignedRedirect:
      description: "Location = URL firmada V4 de lectura con response-content-type fijado desde el registro y response-content-disposition inline (attachment con filename argos-hogar-AAAA-MM-DD.png cuando la peticion lleva download=1); cuerpo vacio. La URL no se registra"
      headers:
        Location: { description: "URL firmada V4; no se registra", schema: { type: string, format: uri, pattern: '^https://' } }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
    ImageAttachment:
      description: "Solo con download=1 y un driver sin URL firmada: cuerpo de la imagen vigente (image/png) como archivo; sin redireccion. Sin download no se usa 200 (se mantiene el 302)"
      headers:
        Content-Disposition:
          schema: { type: string, pattern: '^attachment; filename="argos-hogar-\d{4}-\d{2}-\d{2}\.png"$' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
      content:
        image/png:
          schema: { type: string, format: binary }
    Problem:
      description: Error tipado del catalogo de la 004, de la 005 o del catalogo incremental de la 006 (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    ProblemDetails:
      $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/ProblemDetails'
