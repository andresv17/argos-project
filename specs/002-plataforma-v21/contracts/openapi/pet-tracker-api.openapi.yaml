      x-sdd-change: UNCHANGED
      x-sdd-requirements: [REQ-HOUSE-003, STATE-HOUSE-MEMBERSHIP-001]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204':
          description: "Invitación rechazada"
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argos_session
      description: Token opaco de 32 bytes (base64url), HttpOnly, SameSite=Strict; vigencia de 30 min de inactividad y 24 h absolutas [INV-AUTH2-002]. En la base solo se guarda su SHA-256.
  headers:
    SessionCookie:
      description: argos_session=<token>; HttpOnly; SameSite=Strict; Path=/; Max-Age=86400 (Secure en Cloud)
      schema: { type: string }
    ExpiredCookie:
      description: argos_session=; HttpOnly; SameSite=Strict; Path=/; Max-Age=0
      schema: { type: string }
    ConfirmationTokenHeader:
      description: Token efímero de confirmación de eliminación (10 min, un solo uso). Se entrega una sola vez; la interfaz lo guarda solo en memoria, nunca en localStorage [REQ-BACKUP2-001, REQ-ACC-002, P-09]
      schema: { $ref: '../schemas/common.schema.json#/$defs/ConfirmationToken' }
  parameters:
    CsrfHeader:
      name: X-Argos-Request
      in: header
      required: true
      description: Obligatoria en toda petición que modifica estado, incluida la exportación (emite token); si falta, ERR-AUTH-CSRF-REJECTED. Se valida antes que la sesión y no renueva actividad [INV-AUTH-007]
      schema: { type: string, const: '1' }
    ImportConfirmDigest:
      name: X-Argos-Import-Confirm
      in: header
      required: true
      description: fileDigest devuelto por la previsualización; prueba que se confirma el mismo archivo [REQ-BACKUP2-002]
      schema: { $ref: '../schemas/common.schema.json#/$defs/Sha256Hex' }
    PetId:
      name: petId
      in: path
      required: true
      schema: { $ref: '../schemas/common.schema.json#/$defs/Uuid' }
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema: { $ref: '../schemas/common.schema.json#/$defs/Uuid' }
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '../schemas/common.schema.json#/$defs/Uuid' }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { $ref: '../schemas/common.schema.json#/$defs/Uuid' }
    RecordId:
      name: recordId
      in: path
      required: true
      schema: { $ref: '../schemas/common.schema.json#/$defs/Uuid' }
    RecordCollection:
      name: collection
      in: path
      required: true
      schema: { $ref: '../schemas/medical-records.schema.json#/$defs/RecordCollection' }
  responses:
    Problem:
      description: Error tipado del catálogo contracts/errors/error-catalog.json (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    ProblemDetails:
      $ref: '../schemas/common.schema.json#/$defs/ProblemDetails'
    InviteAccepted:
      type: object
      additionalProperties: false
      required: [received]
      properties:
        received: { type: boolean, const: true }
      description: Cuerpo único de la respuesta de invitar, idéntico exista o no el username [REQ-HOUSE2-001, R3]
    AlertStateMetadata:
      type: object
      additionalProperties: false
      required: [status, uiBadge, label, isActiveAlert, daysRemaining]
      properties:
        status: { $ref: '../schemas/medical-records.schema.json#/$defs/AlertStatus' }
        uiBadge: { type: string, enum: [NEUTRAL_GRAY, DANGER_RED, WARNING_AMBER, SUCCESS_GREEN] }
        label: { type: string, description: 'SUPERSEDED muestra «Reemplazada por registro posterior» [REQ-UI-003]' }
        isActiveAlert: { type: boolean }
        daysRemaining: { type: integer }
    ActiveSanitaryAlertsSummary:
      type: object
      additionalProperties: false
      required: [overdueCount, dueSoonCount, upToDateCount, totalActiveAlerts]
      properties:
        overdueCount: { type: integer, minimum: 0 }
        dueSoonCount: { type: integer, minimum: 0 }
        upToDateCount: { type: integer, minimum: 0 }
        totalActiveAlerts: { type: integer, minimum: 0 }
    WeightEntryView:
      type: object
      additionalProperties: false
      required: [record, deltaKg]
      properties:
        record: { $ref: '../schemas/medical-records.schema.json#/$defs/WeightRecord' }
        deltaKg: { type: [number, 'null'], description: 'null en la primera medición; diferencia exacta calculada en la unidad entera más fina de la especie (centésimas para CANINE y FELINE, milésimas para las demás), sin redondeo [REQ-REC2-001]' }
    VaccinationEntryView:
      type: object
      additionalProperties: false
      required: [record, alert]
      properties:
        record: { $ref: '../schemas/medical-records.schema.json#/$defs/VaccinationRecord' }
        alert:
          oneOf:
            - { $ref: '#/components/schemas/AlertStateMetadata' }
            - { type: 'null' }
          description: null cuando nextBoosterAt es nulo y no existe un registro posterior de la misma clave (fuera de la evaluación); si existe, SUPERSEDED [REQ-REC2-002, F4-M4]
    DewormingEntryView:
      type: object
      additionalProperties: false
      required: [record, alert]
      properties:
        record: { $ref: '../schemas/medical-records.schema.json#/$defs/DewormingRecord' }
        alert:
          oneOf:
            - { $ref: '#/components/schemas/AlertStateMetadata' }
            - { type: 'null' }
    AnyRecord:
      oneOf:
        - { $ref: '../schemas/medical-records.schema.json#/$defs/WeightRecord' }
        - { $ref: '../schemas/medical-records.schema.json#/$defs/BodyMeasurementRecord' }
        - { $ref: '../schemas/medical-records.schema.json#/$defs/VaccinationRecord' }
        - { $ref: '../schemas/medical-records.schema.json#/$defs/DewormingRecord' }
        - { $ref: '../schemas/medical-records.schema.json#/$defs/MedicalVisitRecord' }
        - { $ref: '../schemas/medical-records.schema.json#/$defs/CustomParameterRecord' }
    PetCardView:
      type: object
      additionalProperties: false
      required: [profile, owner, myRole, permissions, computedAge, alertsSummary, globalAlertStatus, latestWeightKg]
      properties:
        profile: { $ref: '../schemas/pet.schema.json#/$defs/PetProfile' }
        owner: { $ref: '../schemas/identity.schema.json#/$defs/OwnerTag' }
        myRole: { $ref: '../schemas/pet.schema.json#/$defs/PetEffectiveRole' }
        permissions: { $ref: '../schemas/pet.schema.json#/$defs/PetPermissions' }
        computedAge: { $ref: '../schemas/pet.schema.json#/$defs/ComputedAge' }
        alertsSummary: { $ref: '#/components/schemas/ActiveSanitaryAlertsSummary' }
        globalAlertStatus:
          oneOf:
            - { type: string, enum: [OVERDUE, DUE_SOON, UP_TO_DATE] }
            - { type: 'null' }
          description: Estado más grave entre vacunas y desparasitaciones; null si no hay registros evaluables [REQ-PET2-002]
        latestWeightKg: { type: [number, 'null'] }
    PetDashboardView:
      type: object
      additionalProperties: false
      required: [profile, owner, myRole, permissions, computedAge, alertsSummary, weights, bodyMeasurements, vaccinations, supersededVaccinations, dewormings, supersededDewormings, medicalVisits, customParameters]
      properties:
        profile: { $ref: '../schemas/pet.schema.json#/$defs/PetProfile' }
        owner: { $ref: '../schemas/identity.schema.json#/$defs/OwnerTag' }
        myRole: { $ref: '../schemas/pet.schema.json#/$defs/PetEffectiveRole' }
        permissions: { $ref: '../schemas/pet.schema.json#/$defs/PetPermissions' }
        computedAge: { $ref: '../schemas/pet.schema.json#/$defs/ComputedAge' }
        alertsSummary: { $ref: '#/components/schemas/ActiveSanitaryAlertsSummary' }
        weights: { type: array, items: { $ref: '#/components/schemas/WeightEntryView' } }
        bodyMeasurements: { type: array, items: { $ref: '../schemas/medical-records.schema.json#/$defs/BodyMeasurementRecord' } }
        vaccinations: { type: array, items: { $ref: '#/components/schemas/VaccinationEntryView' }, description: 'Solo vigentes' }
        supersededVaccinations: { type: array, items: { $ref: '#/components/schemas/VaccinationEntryView' }, description: 'Acordeón «Reemplazados»; solo lectura' }
        dewormings: { type: array, items: { $ref: '#/components/schemas/DewormingEntryView' } }
        supersededDewormings: { type: array, items: { $ref: '#/components/schemas/DewormingEntryView' } }
        medicalVisits: { type: array, items: { $ref: '../schemas/medical-records.schema.json#/$defs/MedicalVisitRecord' } }
        customParameters: { type: array, items: { $ref: '../schemas/medical-records.schema.json#/$defs/CustomParameterRecord' } }
    HouseholdMemberView:
      type: object
      additionalProperties: false
      required: [membership]
      properties:
        membership: { $ref: '../schemas/identity.schema.json#/$defs/HouseholdMember' }
        colorToken:
          oneOf:
            - { $ref: '../schemas/common.schema.json#/$defs/OwnerColorToken' }
            - { type: 'null' }
          description: Solo para miembros ACTIVE [INV-HOUSE-005]
    HouseholdView:
      type: object
      additionalProperties: false
      required: [household, myRole, isHouseholdOwner, members, pendingInvitations]
      properties:
        household: { $ref: '../schemas/identity.schema.json#/$defs/Household' }
        myRole: { $ref: '../schemas/identity.schema.json#/$defs/HouseholdRole' }
        isHouseholdOwner: { type: boolean }
        members: { type: array, items: { $ref: '#/components/schemas/HouseholdMemberView' }, description: 'Miembros ACTIVE con displayName, username y rol; nunca correo' }
        pendingInvitations: { type: array, items: { $ref: '../schemas/identity.schema.json#/$defs/HouseholdInvitation' }, description: 'Vacío para CAREGIVER y READER; el propietario y los ADMIN ven las invitaciones INVITED' }
    HouseholdPetsView:
      type: object
      additionalProperties: false
      required: [household, pets]
      properties:
        household: { $ref: '../schemas/identity.schema.json#/$defs/Household' }
        pets: { type: array, items: { $ref: '#/components/schemas/PetCardView' } }
    InvitationView:
      type: object
      additionalProperties: false
      required: [household, invitedBy, roleOnJoin, invitedAt]
      properties:
        household: { $ref: '../schemas/identity.schema.json#/$defs/Household' }
        invitedBy: { $ref: '../schemas/identity.schema.json#/$defs/UserPublicProfile' }
        roleOnJoin: { $ref: '../schemas/identity.schema.json#/$defs/HouseholdRole' }
        invitedAt: { $ref: '../schemas/common.schema.json#/$defs/IsoTimestamp' }
