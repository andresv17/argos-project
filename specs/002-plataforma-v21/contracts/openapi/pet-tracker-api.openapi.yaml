openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Argos Pet Health & Biometric Tracker API
  version: 3.0.0
  description: >
    Contrato formal de la API HTTP local (127.0.0.1:3100, prefijo /api) de la Feature 002 (Plataforma ARGOS v2.1).
    Sustituye a la versión 2.4.0 de la Feature 001 (MAJOR): cuentas con política de contraseña y sesión con inactividad,
    perfil, eliminación de cuenta con token de respaldo, 8 especies, roles de hogar, asignación mascota-hogar, transferencia de propiedad,
    edición y borrado de registros, respaldo 3.0.0 con previsualización. Contiene 40 operaciones:
    13 nuevas, 21 cambiadas y 6 vigentes sin cambio (marcadas con x-sdd-change).
    Todas las respuestas de error usan application/problem+json (RFC 9457) con los códigos de contracts/errors/error-catalog.json.
    Un usuario sin permiso de lectura recibe 404 (nunca 403) para no revelar la existencia (INV-ACC2-001).
  x-sdd-status: REVIEW
  x-sdd-metadata:
    version: 3.0.0
    status: REVIEW
    supersedes: 2.4.0
    change_type: MAJOR
    traceability: [REQ-AUTH2-001, REQ-AUTH2-002, REQ-AUTH2-003, REQ-AUTH-003, REQ-AUTH-004, REQ-ACC-001, REQ-ACC-002, REQ-TIME-001, REQ-PET2-001, REQ-PET2-002, REQ-PET2-003, REQ-PET-004, REQ-OWN-001, REQ-REC2-001, REQ-REC2-002, REQ-REC2-003, REQ-REC-002, REQ-REC-005, REQ-REC-006, REQ-RBAC-001, REQ-HOUSE-001, REQ-HOUSE-003, REQ-HOUSE2-001, REQ-HOUSE2-002, REQ-HOUSE2-003, REQ-HOUSE2-004, REQ-BACKUP2-001, REQ-BACKUP2-002, REQ-AUD-001, INV-ACC2-001, INV-ACC2-002, INV-AUTH2-001, INV-AUTH2-002, INV-HOUSE2-001, INV-PET2-001, INV-REC2-002, INV-OWN2-001]
servers:
  - url: http://127.0.0.1:3100/api
    description: Servidor local (fase actual)
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: account
  - name: pets
  - name: records
  - name: households
  - name: backup

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: "Registra un usuario con política de contraseña nueva e inicia sesión [REQ-AUTH2-001, INV-AUTH2-001]"
      x-sdd-change: CHANGED
      x-sdd-requirements: [REQ-AUTH2-001, INV-AUTH2-001]
      security: []
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/identity.schema.json#/$defs/RegisterUserInput' }
      responses:
        '201':
          description: "Usuario creado y sesión iniciada (cookie argos_session)"
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '../schemas/identity.schema.json#/$defs/SessionView' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: "Inicia sesión; la contraseña no se valida contra la política [REQ-AUTH2-002, INV-AUTH2-002, INV-AUTH-005, INV-AUTH-006]"
      x-sdd-change: CHANGED
      x-sdd-requirements: [REQ-AUTH2-002, INV-AUTH2-002, INV-AUTH-005, INV-AUTH-006]
      security: []
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/identity.schema.json#/$defs/LoginInput' }
      responses:
        '200':
          description: "Sesión iniciada con token nuevo"
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '../schemas/identity.schema.json#/$defs/SessionView' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: "Cierra la sesión actual (idempotente, 204 en cualquier estado) [REQ-AUTH-003, STATE-AUTH-SESSION-001]"
      x-sdd-change: UNCHANGED
      x-sdd-requirements: [REQ-AUTH-003, STATE-AUTH-SESSION-001]
      security: []
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204':
          description: "Sesión revocada y cookie eliminada"
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentSession
      summary: "Sesión actual: perfil propio con email, idioma y zona horaria; renueva la inactividad [REQ-AUTH-004, INV-AUTH2-002]"
      x-sdd-change: CHANGED
      x-sdd-requirements: [REQ-AUTH-004, INV-AUTH2-002]
      responses:
        '200':
          description: "Sesión vigente"
          content:
            application/json:
              schema: { $ref: '../schemas/identity.schema.json#/$defs/SessionView' }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /account/password:
    post:
      tags: [account]
      operationId: changePassword
      summary: "Cambia la contraseña; revoca las demás sesiones y conserva la actual (misma transacción) [REQ-AUTH2-003, INV-AUTH2-001, INV-AUTH-005]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-AUTH2-003, INV-AUTH2-001, INV-AUTH-005]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/identity.schema.json#/$defs/ChangePasswordInput' }
      responses:
        '204':
          description: "Contraseña cambiada; demás sesiones revocadas"
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /account/profile:
    patch:
      tags: [account]
      operationId: updateProfile
      summary: "Edita displayName, email, idioma y zona horaria de pantalla [REQ-ACC-001, REQ-TIME-001]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ACC-001, REQ-TIME-001]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/identity.schema.json#/$defs/UpdateProfileInput' }
      responses:
        '200':
          description: "Perfil actualizado"
          content:
            application/json:
              schema: { $ref: '../schemas/identity.schema.json#/$defs/UserSelfProfile' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /account/deletion:
    post:
      tags: [account]
      operationId: deleteAccount
      summary: "Elimina la cuenta: frase literal, contraseña y token de respaldo vigente; dos fases STATE-ACCOUNT-DELETE-001 (A sin escrituras, B en una transacción) [REQ-ACC-002, REQ-AUD-001, SC-014]"
      description: |
        Fase A (sin escrituras): A1 valida sesión, cabecera X-Argos-Request y esquema (frase literal y contraseña; el token es opcional en el esquema); A2 verifica la contraseña actual (los fallos cuentan para el limitador, ERR-AUTH-TOO-MANY-ATTEMPTS / ERR-AUTH-INVALID-CREDENTIALS) y comprueba la forma del token; A3 calcula el seudónimo HMAC.
        Un backupConfirmationToken ausente, mal formado, caducado, usado o ajeno responde siempre ERR-ACCOUNT-CONFIRMATION-MISMATCH (409), nunca ERR-SCHEMA-VALIDATION-FAILED.
        Fase B (una transacción con bloqueo de escritura): B3 consume el token con un UPDATE condicional (usedAt IS NULL AND expiresAt > now AND userId = sesión, exactamente 1 fila); B4 relee el bloqueo ERR-ACCOUNT-OWNS-SHARED-HOUSEHOLD; B5 relee ERR-ACCOUNT-OWNS-SHARED-PETS; B6 aserción de seguridad (ERR-INTERNAL-UNEXPECTED sin borrar datos ajenos); B7 a B10 auditan, seudonimizan, borran de hoja a raíz y comprueban poscondiciones; B11 confirma. Cualquier fallo de B revierte todo, incluido el consumo del token, que sigue vigente hasta su caducidad.
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ACC-002, REQ-AUD-001, SC-014]
      x-sdd-error-order: [ERR-AUTH-CSRF-REJECTED, ERR-AUTH-UNAUTHENTICATED, ERR-SCHEMA-VALIDATION-FAILED, ERR-AUTH-TOO-MANY-ATTEMPTS, ERR-AUTH-INVALID-CREDENTIALS, ERR-ACCOUNT-CONFIRMATION-MISMATCH, ERR-ACCOUNT-OWNS-SHARED-HOUSEHOLD, ERR-ACCOUNT-OWNS-SHARED-PETS]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/identity.schema.json#/$defs/DeleteAccountInput' }
      responses:
        '204':
          description: "Cuenta eliminada; la cookie se expira"
          headers:
            Set-Cookie: { $ref: '#/components/headers/ExpiredCookie' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /backup/export:
    post:
      tags: [backup]
      operationId: exportBackup
      summary: "Exporta solo las mascotas propias (sobre 3.0.0) y emite el token efímero de confirmación en una cabecera; cambia estado, por eso POST con CSRF [REQ-BACKUP2-001, REQ-RBAC-001, REQ-ACC-002]"
      x-sdd-change: CHANGED
      x-sdd-requirements: [REQ-BACKUP2-001, REQ-RBAC-001, REQ-ACC-002]
      x-sdd-rbac-action: "EXPORT_IMPORT_BACKUP"
      x-sdd-rate-limit: "EXPORT_MAX_PER_WINDOW por EXPORT_WINDOW_MINUTES (configurable en src/infrastructure/config/; ERR-RATE-LIMITED)"
      x-sdd-token-emission: "el archivo se arma completo en memoria; el token nuevo reemplaza al anterior en la misma transacción solo si la generación terminó bien"
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '200':
          description: "Archivo JSON descargable; el token (10 min, un solo uso) viaja en X-Argos-Confirmation-Token y NUNCA dentro del archivo"
          headers:
            Content-Disposition:
              schema: { type: string, pattern: '^attachment; filename="argos-backup-\d{4}-\d{2}-\d{2}\.json"$' }
            X-Argos-Confirmation-Token: { $ref: '#/components/headers/ConfirmationTokenHeader' }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '../schemas/backup-envelope.schema.json#/$defs/BackupEnvelopeV3' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /backup/import/preview:
    post:
      tags: [backup]
      operationId: previewBackupImport
      summary: "Previsualiza la importación (acepta 1.0.0, 2.0.0 y 3.0.0, hasta 10 MB); no persiste nada [REQ-BACKUP2-002, STATE-BACKUP-001, REQ-RBAC-001]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-BACKUP2-002, STATE-BACKUP-001, REQ-RBAC-001]
      x-sdd-rbac-action: "EXPORT_IMPORT_BACKUP"
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { description: 'Cuerpo crudo; se valida dentro de STATE-BACKUP-001 en modo PREVIEW (no por el validador de request). Tope de 10 MB sobre bytes leídos.' }
      responses:
        '200':
          description: "Previsualización con conteos, colisiones propias, mascotas compartidas afectadas y fileDigest"
          content:
            application/json:
              schema: { $ref: '../schemas/backup-envelope.schema.json#/$defs/ImportPreviewResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /backup/import:
    post:
      tags: [backup]
      operationId: importBackup
      summary: "Importa por reemplazo atómico solo las mascotas propias; exige el fileDigest de la previsualización [REQ-BACKUP2-002, STATE-BACKUP-001, INV-BACKUP-001, SC-004]"
      x-sdd-change: CHANGED
      x-sdd-requirements: [REQ-BACKUP2-002, STATE-BACKUP-001, INV-BACKUP-001, SC-004]
      x-sdd-rbac-action: "EXPORT_IMPORT_BACKUP"
      parameters:
        - { $ref: '#/components/parameters/ImportConfirmDigest' }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { description: 'Cuerpo crudo; mismos bytes que la previsualización. Un digest distinto responde ERR-SCHEMA-VALIDATION-FAILED.' }
      responses:
        '200':
          description: "Importación completada"
          content:
            application/json:
              schema: { $ref: '../schemas/backup-envelope.schema.json#/$defs/ImportBackupResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /pets:
    get:
      tags: [pets]
      operationId: listMyPets
      summary: "Mascotas propias y las visibles por asignación a hogares, con semáforo global [REQ-PET2-002, INV-ACC2-001]"
      x-sdd-change: CHANGED
      x-sdd-requirements: [REQ-PET2-002, INV-ACC2-001]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 50 }, description: 'Subcadena del nombre sin distinguir mayúsculas ni tildes (D-03: NFD y eliminación de marcas)' }
        - { name: filter, in: query, required: false, schema: { type: string, enum: [ALL, CANINE, FELINE, OTHERS, WITH_ALERTS], default: ALL }, description: 'Todos, Perros, Gatos, Otros y Con alertas sanitarias' }
      responses:
        '200':
          description: "Tarjetas de mascotas ordenadas por name (localeCompare es, sensibilidad base), createdAt e id"
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PetCardView' } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      tags: [pets]
      operationId: registerPet
      summary: "Registra una mascota (8 especies, sin cupo) [REQ-PET2-001, INV-PET2-001, REQ-HOUSE2-003]"
      x-sdd-change: CHANGED
      x-sdd-requirements: [REQ-PET2-001, INV-PET2-001, REQ-HOUSE2-003]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/pet.schema.json#/$defs/CreatePetInput' }
      responses:
        '201':
          description: "Mascota creada con ownerUserId = usuario autenticado"
          content:
            application/json:
              schema: { $ref: '../schemas/pet.schema.json#/$defs/PetProfile' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /pets/{petId}:
    parameters:
      - { $ref: '#/components/parameters/PetId' }
    patch:
      tags: [pets]
      operationId: updatePet
      summary: "Edita datos básicos [REQ-PET2-001, INV-ACC2-002, INV-OWN2-001]"
      x-sdd-change: CHANGED
      x-sdd-requirements: [REQ-PET2-001, INV-ACC2-002, INV-OWN2-001]
      x-sdd-rbac-action: "EDIT_PET_BASICS"
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/pet.schema.json#/$defs/UpdatePetInput' }
      responses:
        '200':
          description: "Mascota actualizada"
          content:
            application/json:
              schema: { $ref: '../schemas/pet.schema.json#/$defs/PetProfile' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [pets]
      operationId: deletePet
      summary: "Elimina la mascota con sus 6 colecciones y asignaciones (solo Propietario Legal) [REQ-PET-004, INV-PET-005, INV-ACC2-002]"
      x-sdd-change: CHANGED
      x-sdd-requirements: [REQ-PET-004, INV-PET-005, INV-ACC2-002]
      x-sdd-rbac-action: "DELETE_PET"
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204':
          description: "Mascota eliminada atómicamente"
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /pets/{petId}/dashboard:
    parameters:
      - { $ref: '#/components/parameters/PetId' }
    get:
      tags: [pets]
      operationId: getPetDashboard
      summary: "Ficha técnica con rol efectivo, permisos y registros SUPERSEDED separados [REQ-PET2-003, INV-ACC2-001, INV-SORT-001]"
      x-sdd-change: CHANGED
      x-sdd-requirements: [REQ-PET2-003, INV-ACC2-001, INV-SORT-001]
      responses:
        '200':
          description: "Ficha completa"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetDashboardView' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /pets/{petId}/ownership-transfer:
    parameters:
      - { $ref: '#/components/parameters/PetId' }
    post:
      tags: [pets]
      operationId: transferPetOwnership
      summary: "Transfiere la propiedad legal de forma inmediata a un miembro ACTIVE de un hogar con la mascota [REQ-OWN-001, SC-016]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-OWN-001, SC-016]
      x-sdd-rbac-action: "TRANSFER_PET_OWNERSHIP"
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/pet.schema.json#/$defs/TransferPetOwnershipInput' }
      responses:
        '200':
          description: "Propiedad transferida; 1 fila OWNERSHIP_TRANSFER y 1 UNASSIGN por asignación podada"
          content:
            application/json:
              schema: { $ref: '../schemas/pet.schema.json#/$defs/TransferPetOwnershipResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /pets/{petId}/records/weights:
    parameters:
      - { $ref: '#/components/parameters/PetId' }
    post:
      tags: [records]
      operationId: addWeightRecord
      summary: "Registra peso (rango por especie; deltaKg exacto) [REQ-REC2-001, INV-REC2-002]"
      x-sdd-change: CHANGED
      x-sdd-requirements: [REQ-REC2-001, INV-REC2-002]
      x-sdd-rbac-action: "WRITE_WEIGHTS_AND_MEASUREMENTS"
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/medical-records.schema.json#/$defs/CreateWeightInput' }
      responses:
        '201':
          description: "Registro creado"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightEntryView' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /pets/{petId}/records/measurements:
    parameters:
      - { $ref: '#/components/parameters/PetId' }
    post:
      tags: [records]
      operationId: addBodyMeasurementRecord
      summary: "Registra medidas corporales [REQ-REC-002, INV-REC-003]"
      x-sdd-change: UNCHANGED
      x-sdd-requirements: [REQ-REC-002, INV-REC-003]
      x-sdd-rbac-action: "WRITE_WEIGHTS_AND_MEASUREMENTS"
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/medical-records.schema.json#/$defs/CreateBodyMeasurementInput' }
      responses:
        '201':
          description: "Registro creado"
          content:
            application/json:
              schema: { $ref: '../schemas/medical-records.schema.json#/$defs/BodyMeasurementRecord' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /pets/{petId}/records/vaccinations:
    parameters:
      - { $ref: '#/components/parameters/PetId' }
    post:
      tags: [records]
