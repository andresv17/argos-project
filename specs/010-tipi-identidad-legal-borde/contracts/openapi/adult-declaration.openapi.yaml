openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Argos Pet Health & Biometric Tracker API - delta de la feature 010 (declaracion de mayoria de edad)
  version: 1.0.0
  description: >
    Documento INCREMENTAL y UNICO de la feature 010 (Bloque D, #75): contiene solo las dos operaciones de registro cuyo CUERPO cambia por la
    declaracion «Soy mayor de edad (18+)» (D10-05, REQ-MEN10-001). Los OpenAPI de 004 (3.5.0), 005, 006 y 009 permanecen sin cambio; estas dos
    operaciones los reemplazan en cuanto a requestBody (mismos operationId, ruta, respuestas y limites). Errores en application/problem+json
    (RFC 9457) del catalogo incremental de 010 y de los heredados. Sin fecha de nacimiento ni documento (REQ-MEN10-003).
  x-sdd-status: DRAFT
  x-sdd-metadata:
    version: 1.0.0
    status: DRAFT
    supersedes: null
    change_type: MAJOR
    change_note: "1.0.0 (feature 010, Bloque D, T1423, Keymaker con autorizacion expresa de Neo Nivel 2 en Logos, 2026-11-25; D10-05 y H-03 APPROVED 2026-11-24): documento nuevo con registerUser y chooseGoogleUsername con adultDeclaration obligatorio en el cuerpo. Orden de validacion: la declaracion se comprueba ANTES de la existencia del usuario o del correo (INV-MEN10-001: el 422 es identico exista o no el usuario) y, en Google, ANTES de consumir el estado OAuth USERNAME (H-03 opcion A: el 422 no consume el estado ni retira la cookie argos_oauth; el reintento con declaracion crea la cuenta). El resto de respuestas y limites no cambia (201 AccountStatusView PENDING sin sesion, 409 username ocupado, 429). Cuentas anteriores intactas (REQ-MEN10-002). Estado DRAFT: lo fija solo Neo."
    traceability: [REQ-MEN10-001, REQ-MEN10-002, REQ-MEN10-003, INV-MEN10-001, EDGE-010-005, EDGE-010-010]
servers:
  - url: http://127.0.0.1:3100/api
    description: Servidor local (prefijo /api)
security:
  - sessionCookie: []
tags:
  - name: auth

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: "Registra un usuario con contrasena y declaracion de mayoria de edad; la cuenta nace PENDING y NO inicia sesion [REQ-MEN10-001, REQ-AUTH2-001, REQ-APR9-002, INV-MEN10-001]"
      description: "Sin `adultDeclaration: true` responde 422 ERR-MEN10-ADULT-DECLARATION-REQUIRED con el mismo cuerpo exista o no el usuario o el correo (INV-MEN10-001): la declaracion se valida antes de consultar la existencia. Guarda `adult_declared_at` (reloj del servidor) y `adult_notice_version`. El resto del comportamiento es el de registerUser de 004 (3.5.0)."
      x-sdd-change: CHANGED
      x-sdd-requirements: [REQ-MEN10-001, REQ-MEN10-002, REQ-MEN10-003, INV-MEN10-001]
      security: []
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/adult-declaration.schema.json#/$defs/RegisterUserWithAdultDeclarationInput' }
      responses:
        '201':
          description: "Solicitud creada: accountStatus PENDING; NO hay Set-Cookie ni fila de sesion (REQ-APR9-002, EDGE-009-038)"
          content:
            application/json:
              schema: { $ref: '../schemas/identity.schema.json#/$defs/AccountStatusView' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422':
          description: "ERR-MEN10-ADULT-DECLARATION-REQUIRED (declaracion ausente o distinta de `true`; uniforme, INV-MEN10-001) o ERR-SCHEMA-VALIDATION-FAILED / ERR-AUTH-WEAK-PASSWORD del resto del cuerpo"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /auth/google/username:
    post:
      tags: [auth]
      operationId: chooseGoogleUsername
      summary: "Primer acceso con Google: elige el username, declara ser mayor de edad y crea la cuenta PENDING sin sesion [REQ-MEN10-001, EDGE-010-005, EDGE-010-010, REQ-AUTH2-001]"
      description: "Usa el estado intermedio identificado por la cookie argos_oauth (Path=/api/auth/google, 900 s). H-03 opcion A: `adultDeclaration` se valida ANTES de consumir el estado USERNAME; el 422 ERR-MEN10-ADULT-DECLARATION-REQUIRED NO consume el estado ni retira la cookie, y el reintento con declaracion crea la cuenta. Con dos pestanas sobre el mismo estado (una sin casilla y otra con ella) la primera recibe 422 y la segunda crea una sola cuenta. El 422 es identico con un username libre y con uno ocupado (INV-MEN10-001). El resto del comportamiento es el de chooseGoogleUsername de 004 (3.5.0)."
      x-sdd-change: CHANGED
      x-sdd-requirements: [REQ-MEN10-001, REQ-MEN10-002, REQ-MEN10-003, INV-MEN10-001, EDGE-010-005, EDGE-010-010]
      security: []
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/adult-declaration.schema.json#/$defs/GoogleChooseUsernameWithAdultDeclarationInput' }
      responses:
        '201':
          description: "Cuenta creada en PENDING: AccountStatusView SIN cookie argos_session ni fila de sesion (REQ-APR9-002, EDGE-009-006); argos_oauth se retira solo en este caso"
          content:
            application/json:
              schema: { $ref: '../schemas/identity.schema.json#/$defs/AccountStatusView' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422':
          description: "ERR-MEN10-ADULT-DECLARATION-REQUIRED (el estado OAuth sigue valido, sin Set-Cookie que retire argos_oauth) o ERR-SCHEMA-VALIDATION-FAILED del resto del cuerpo"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argos_session
      description: Cookie de sesion de usuario de 002/004 (HttpOnly, SameSite=Strict). Las dos operaciones de este documento son anonimas (security vacio por operacion).
  parameters:
    CsrfHeader:
      name: X-Argos-Request
      in: header
      required: true
      description: "Cabecera anti-CSRF global; si falta, ERR-AUTH-CSRF-REJECTED"
      schema: { type: string, const: '1' }
  responses:
    Problem:
      description: Error tipado del catalogo incremental de la 010 o de los catalogos heredados de 004, 005, 006 y 009 (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    ProblemDetails:
      $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/ProblemDetails'
