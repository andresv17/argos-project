        - adminSessionCookie: []
      summary: "Aprueba una solicitud: PENDING -> ACTIVE (compare-and-set) [REQ-APR9-003, STATE-ACCT9-001]"
      description: >
        Orden: X-Argos-Request (403 antes de la sesion, regla de 1.2.0), sesion de administracion (404 uniforme), validacion del identificador (422) y decision. Transicion atomica PENDING -> ACTIVE con compare-and-set sobre account_status y la fecha de creacion (EDGE-009-039): solo si la solicitud sigue PENDING y no supera 30 dias. Si otra via la decidio, la purga gano o no existe, responde 404 ERR-ADMIN-REGISTRATION-NOT-FOUND sin revelar el estado previo. Con dos administradores a la vez, uno gana y el otro recibe el mismo 404 (EDGE-009-002). Guarda la fecha y el id del administrador de la decision y deja entrada en admin_audit_entries con id de administrador, accion y marca de tiempo, sin correo ni sub (REQ-ADM9-004). No envia correo (D9-04 iv) y no crea sesion: la persona inicia sesion luego.
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-APR9-003, REQ-APR9-005, REQ-ADM9-004, REQ-ADM9-005, INV-ADM9-001, INV-ADM9-002, STATE-ACCT9-001, EDGE-009-002, EDGE-009-038, EDGE-009-039]
      x-sdd-rbac-action: "PLATFORM_ADMIN_REGISTRATION_APPROVE"
      x-sdd-rbac-scope: "plataforma; PLATFORM_ADMIN nunca entra en can(rol, accion) de hogar (INV-ADM9-001)"
      x-sdd-error-order: [ERR-AUTH-CSRF-REJECTED, ERR-SCHEMA-VALIDATION-FAILED, ERR-ADMIN-REGISTRATION-NOT-FOUND, ERR-INTERNAL-UNEXPECTED]
