          description: "Catalogo de parametros"
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminParameterCatalog' }
        '404': { $ref: '#/components/responses/NotFoundUniform' }
        '500': { $ref: '#/components/responses/Problem' }

  /admin/parameters/{key}:
    put:
      tags: [admin-parameters]
      operationId: updateAdminParameter
      security:
        - adminSessionCookie: []
      summary: "Edita el valor de un parametro del catalogo con control optimista If-Match [REQ-CFG9-001, REQ-CFG9-007, EDGE-009-016]"
      description: >
        Orden: X-Argos-Request (403 antes de la sesion, regla de 1.2.0), sesion de administracion (404 uniforme), validacion de esquema
        (422: clave fuera del catalogo, clave no escribible en esta entrega, If-Match ausente o mal formado, cuerpo invalido, valor
        fuera de tipo, rango, lista cerrada o formato del catalogo de codigo), precondicion (412) y, solo en la subfase 5b, la regla de
        coste (422). Un valor invalido NUNCA escribe (EDGE-009-014): se rechaza con ERR-SCHEMA-VALIDATION-FAILED, ya vigente en 001/004/005/006
        y no redefinido aqui (SC-009-018: 0, -1, abc, ' 12 ', 12.5 y 51 para album.max_photos_per_pet; el valor es texto canonico exacto, sin
        recortar). SIN crear claves: key es un enum cerrado y toda otra clave es 422; si la fila de una clave del catalogo no existe, la
        escritura la inserta, que no es una clave nueva. En 5a solo son escribibles album.max_photos_per_pet y scene.enabled; las otras
        cuatro claves se rechazan con 422 hasta 5b y NO escriben (P5-06 = B). Concurrencia (REQ-CFG9-007): If-Match debe ser el etag
        vigente de la clave; si otro administrador o ventana la cambio, 412 ERR-ADMIN-PARAMETER-PRECONDITION-FAILED sin escribir
        (EDGE-009-016); el detalle no incluye el valor vigente. La escritura actualiza value y updated_at en UNA transaccion, deja
        updated_by_user_id en NULL y registra una entrada de admin_audit_entries con id de administrador, clave, accion y marca de tiempo,
        SIN el valor (ADR-009-08, REQ-CFG9-007). En 5b, un cambio de scene.provider_model, scene.provider_location o
        scene.global_quota_max que supere el tope mensual segun la regla de gasto acumulado (EDGE-009-036) responde 422
        ERR-ADMIN-SCENE-COST-CAP-EXCEEDED sin escribir y sin cifras en el detalle. Aplica en caliente sin reiniciar (<= 60 s por instancia).
        Bajar album.max_photos_per_pet por debajo del conteo existente se permite: conserva las fotos y solo bloquea subidas nuevas
        (EDGE-009-015); el aviso previo es de la interfaz.
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-CFG9-001, REQ-CFG9-002, REQ-CFG9-003, REQ-CFG9-004, REQ-CFG9-005, REQ-CFG9-007, REQ-CFG9-008, REQ-ADM9-004, INV-CFG9-001, INV-CFG9-002, INV-CFG9-003, EDGE-009-014, EDGE-009-015, EDGE-009-016, EDGE-009-017, EDGE-009-036]
      x-sdd-rbac-action: "PLATFORM_ADMIN_PARAMETER_UPDATE"
      x-sdd-rbac-scope: "plataforma; PLATFORM_ADMIN nunca entra en can(rol, accion) de hogar (INV-ADM9-001)"
      x-sdd-error-order: [ERR-AUTH-CSRF-REJECTED, ERR-SCHEMA-VALIDATION-FAILED, ERR-ADMIN-PARAMETER-PRECONDITION-FAILED, ERR-ADMIN-SCENE-COST-CAP-EXCEEDED, ERR-INTERNAL-UNEXPECTED]
      x-sdd-csrf-before-session: true
      x-sdd-audit: admin_audit_entries
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/ParameterKeyPath' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminParameterWriteInput' }
      responses:
        '200':
          description: "Parametro actualizado: vista con el nuevo valor, fecha, autor y etag"
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            ETag: { $ref: '#/components/headers/ParameterETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminParameterView' }
        '403':
          description: "ERR-AUTH-CSRF-REJECTED: falta X-Argos-Request; se responde antes de resolver la sesion de administracion, con o sin ella (INV-AUTH-007). Un origen ajeno se valida despues de la sesion: sin sesion sigue siendo 404 uniforme"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '404': { $ref: '#/components/responses/NotFoundUniform' }
        '412':
          description: "ERR-ADMIN-PARAMETER-PRECONDITION-FAILED: If-Match distinto del etag vigente (edicion concurrente, EDGE-009-016); no se escribe y el detalle no incluye el valor vigente"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '422':
          description: "ERR-SCHEMA-VALIDATION-FAILED (clave fuera del catalogo o no escribible aun, If-Match ausente o mal formado, valor invalido; sin escritura) o ERR-ADMIN-SCENE-COST-CAP-EXCEEDED (solo subfase 5b, regla de gasto acumulado de EDGE-009-036)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '500': { $ref: '#/components/responses/Problem' }

  /admin/parameters/scene-quota/reset:
    post:
      tags: [admin-parameters]
      operationId: resetAdminSceneQuota
      security:
        - adminSessionCookie: []
      summary: "Reinicia a cero la cuota de generaciones de imagen de las cuentas de usuario del administrador [REQ-CFG9-006, EDGE-009-022, EDGE-009-023]"
      description: >
        Es una OPERACION, no un parametro (REQ-CFG9-001 g): no tiene clave ni etag. Orden: X-Argos-Request (403 antes de la sesion, regla
        de 1.2.0), sesion de administracion (404 uniforme), cuerpo vacio (422 si trae contenido) y reinicio. Alcance (D9-10, ADR-009-13):
        pone a cero consumed_generations y scene_quota_carry SOLO de las cuentas de usuario del administrador, identificadas por el sub de Google
        vinculado (auth_identities) o por un correo verificado igual a un correo de la lista cerrada de administradores; NUNCA toca
        scene.global_quota_used.YYYY-MM ni cuentas ajenas. No falla si el administrador no tiene escena ni hogar: devuelve 200 con
        accountsReset = 0 si ninguna cuenta coincide, o deja el contador de la cuenta en cero (EDGE-009-022). Es compare-and-set contra
        una generacion en curso de esas cuentas: si el contador cambia mientras se reinicia, no suma ni resta de forma incoherente y
        responde 409 ERR-ADMIN-QUOTA-RESET-CONFLICT sin cambios parciales, para reintentar (EDGE-009-023). Deja una entrada de admin_audit_entries
        con id de administrador, accion y marca de tiempo, sin ids de cuentas ni contadores. El cuerpo de la respuesta no identifica cuentas.
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-CFG9-006, REQ-CFG9-001, REQ-ADM9-004, INV-CFG9-003, EDGE-009-022, EDGE-009-023]
      x-sdd-rbac-action: "PLATFORM_ADMIN_SCENE_QUOTA_RESET"
      x-sdd-rbac-scope: "plataforma; PLATFORM_ADMIN nunca entra en can(rol, accion) de hogar (INV-ADM9-001)"
      x-sdd-error-order: [ERR-AUTH-CSRF-REJECTED, ERR-SCHEMA-VALIDATION-FAILED, ERR-ADMIN-QUOTA-RESET-CONFLICT, ERR-INTERNAL-UNEXPECTED]
      x-sdd-csrf-before-session: true
      x-sdd-audit: admin_audit_entries
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: false
        description: "Sin cuerpo. Cualquier cuerpo no vacio se rechaza (ERR-SCHEMA-VALIDATION-FAILED)."
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200':
          description: "Cuota reiniciada (accountsReset puede ser 0)"
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuotaResetResult' }
        '403':
          description: "ERR-AUTH-CSRF-REJECTED: falta X-Argos-Request; se responde antes de resolver la sesion de administracion, con o sin ella (INV-AUTH-007). Un origen ajeno se valida despues de la sesion: sin sesion sigue siendo 404 uniforme"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '404': { $ref: '#/components/responses/NotFoundUniform' }
        '409':
          description: "ERR-ADMIN-QUOTA-RESET-CONFLICT: compare-and-set perdido contra una generacion en curso; sin cambios parciales; reintentar"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argos_session
      description: Cookie de sesion de usuario de 002/004 (HttpOnly, SameSite=Strict). Las dos operaciones de esta version son de usuario; ninguna acepta la cookie de administracion.
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: argos_admin_session
      description: Cookie de sesion de ADMINISTRACION (HttpOnly, SameSite=Strict, Path=/api/admin; Enmienda 009-A). Solo la aceptan las operaciones /admin/*; nunca autoriza la API de usuarios, y argos_session nunca autoriza /admin/* (INV-ADM9-002).
  headers:
    AdminOAuthCookie:
      description: argos_admin_oauth=<id opaco>; HttpOnly; SameSite=Lax; Path=/api/admin/auth/google; Max-Age=900 (Secure en Cloud); de un solo uso. SameSite=Lax solo para esta cookie (Enmienda 009-A) porque una cookie Strict no viaja en la navegacion que vuelve desde Google
      schema: { type: string }
    AdminSessionCookie:
      description: "argos_admin_session=<id opaco de 32 bytes base64url, nuevo>; HttpOnly; SameSite=Strict; Path=/api/admin (Secure en Cloud); 30 min absolutos desde su creacion y 10 min de inactividad (Enmienda 009-A). Ademas argos_admin_oauth=; Max-Age=0 (se consume)"
      schema: { type: string }
    AdminSessionExpiredCookie:
      description: argos_admin_session=; HttpOnly; SameSite=Strict; Path=/api/admin; Max-Age=0
      schema: { type: string }
    ParameterETag:
      description: "ETag del parametro tras la escritura, igual al campo etag de la vista (comillas dobles incluidas); es el valor que la siguiente escritura envia en If-Match"
      schema: { type: string, pattern: '^"[A-Za-z0-9_-]{8,64}"$' }
    NoStore:
      description: "Cache-Control: no-store"
      schema: { type: string, const: 'no-store' }
    OAuthStateCookie:
      description: argos_oauth=<id opaco>; HttpOnly; SameSite=Lax; Path=/api/auth/google; Max-Age=900 (Secure en Cloud); de un solo uso. Misma cookie de 008; la intencion DELETE vive en el estado del servidor, no en la cookie
      schema: { type: string }
    ExpiredCookie:
      description: argos_session=; HttpOnly; SameSite=Strict; Path=/; Max-Age=0
      schema: { type: string }
  parameters:
    CsrfHeader:
      name: X-Argos-Request
      in: header
      required: true
      description: >-
        La verificacion de X-Argos-Request se aplica a las operaciones que mutan estado; si falta, ERR-AUTH-CSRF-REJECTED (el origen se valida despues de la sesion). REGLA PARA TODA OPERACION MUTANTE de /api/admin/*: Toda operacion mutante de /api/admin/* sin la cabecera global X-Argos-Request: 1 responde 403 ERR-AUTH-CSRF-REJECTED ANTES de resolver la sesion de administracion (coherente con INV-AUTH-007), con independencia de que haya sesion o no, de modo que no revela su existencia; el 404 uniforme solo aplica despues, a la peticion que si lleva la cabecera y no tiene sesion. En endAdminSession, sin la cabecera responde 403 con o sin sesion; con la cabecera y sin sesion, 404 uniforme. Se valida antes que la sesion y no renueva actividad [INV-AUTH-007]
      schema: { type: string, const: '1' }
    ParameterKeyPath:
      name: key
      in: path
      required: true
      description: "Clave del catalogo cerrado del codigo (REQ-CFG9-001: sin claves nuevas desde la interfaz); cualquier otro valor responde ERR-SCHEMA-VALIDATION-FAILED (422) despues de la sesion"
      schema: { $ref: '#/components/schemas/AdminParameterKey' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: "etag vigente de la clave, tal como lo devolvio listAdminParameters o la ultima escritura (comillas dobles incluidas). Ausente o con otra forma: ERR-SCHEMA-VALIDATION-FAILED (422); correcto pero ya no vigente: 412 ERR-ADMIN-PARAMETER-PRECONDITION-FAILED. No se acepta comodin"
      schema: { type: string, pattern: '^"[A-Za-z0-9_-]{8,64}"$' }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      description: "Identificador opaco de la solicitud (users.id de la cuenta PENDING o REJECTED); uno invalido responde ERR-SCHEMA-VALIDATION-FAILED (422) despues de la sesion"
      schema: { $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/Uuid' }
  responses:
    RegistrationNotFound:
      description: "ERR-ADMIN-REGISTRATION-NOT-FOUND (404 application/problem+json), SOLO con sesion de administracion valida: la solicitud no existe, fue purgada, ya fue decidida por otra via o supera 30 dias (compare-and-set perdido, EDGE-009-039). No revela el estado previo ni distingue los casos. Sin sesion de administracion NO se usa: sigue el 404 uniforme text/plain"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFoundUniform:
      description: >
        404 UNIFORME (EDGE-009-008, INV-ADM9-001): el mismo estado, cuerpo (text/plain 'Not Found'), cabeceras y secuencia de puertos
        que una ruta inexistente de /api/ (src/infrastructure/http/plugins/static-assets.ts), y con tiempo de respuesta independiente
        de la sesion. No es application/problem+json ni lleva codigo ERR-*: un codigo propio distinguiria la ruta de una inexistente.
        Cubre: sin sesion de administracion, sesion vencida, revocada o ajena, cookie de usuario, correo retirado de la lista y todo
        fallo del callback.
      content:
        text/plain:
          schema: { type: string, const: 'Not Found' }
    AdminRateLimited:
      description: "ERR-ADMIN-RATE-LIMITED (EDGE-009-035): demasiados fallos desde la IP efectiva en el flujo de Google de administracion; solo en inicio y callback"
      headers:
        Retry-After:
          description: Segundos hasta que expire la ventana de la IP efectiva (entero; valor derivado de app-config.ts, no escrito en el contrato)
          schema: { type: integer, minimum: 1 }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem:
      description: Error tipado del catalogo incremental de la 009 o de los catalogos heredados de 004, 005 y 006 (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    ProblemDetails:
      $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/ProblemDetails'
    AdminSessionView:
      type: object
      additionalProperties: false
      required: [authenticated, adminId, expiresAt, idleExpiresAt]
      description: "[REQ-ADM9-002] Vista cerrada de la sesion de administracion. No incluye correo, sub ni el identificador de sesion."
      properties:
        authenticated: { type: boolean, const: true }
        adminId:
          type: string
          minLength: 1
          maxLength: 64
          description: "Identificador opaco del administrador, el mismo que se registra en admin_audit_entries (REQ-ADM9-004); no es un userId de usuario"
        expiresAt: { type: string, format: date-time, description: "Fin absoluto de la sesion (30 min desde su creacion)" }
        idleExpiresAt: { type: string, format: date-time, description: "Fin por inactividad (10 min desde la ultima actividad), sin superar expiresAt" }
    AdminPendingCount:
      type: object
      additionalProperties: false
      required: [pending, warning]
      description: "[REQ-APR9-005, EDGE-009-040] Contador de cuentas PENDING; el umbral numerico de aviso no se expone."
      properties:
        pending: { type: integer, minimum: 0, description: "Cuentas en estado PENDING (STATE-ACCT9-001)" }
        warning: { type: boolean, description: "true si PENDING supera el umbral de aviso aprobado (D9-25, solo en app-config.ts)" }
    AdminRegistrationItem:
      type: object
      additionalProperties: false
      required: [registrationId, username, requestedAt, method]
      description: "[REQ-APR9-005] Solicitud PENDING en la lista de /admin. No incluye correo, sub, hash ni sesion (NFR-009-004)."
      properties:
        registrationId: { $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/Uuid' }
        username: { type: string, minLength: 1, maxLength: 254, description: "Username de la solicitud tal como se registro" }
        requestedAt: { type: string, format: date-time, description: "Fecha de la solicitud (users.created_at); base de la purga de 30 dias" }
        method: { type: string, enum: [PASSWORD, GOOGLE], description: "Metodo de registro (usuario y contrasena, o Google)" }
    AdminRegistrationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      description: "[REQ-APR9-005] Pagina de la lista de pendientes; nextCursor es null en la ultima pagina."
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AdminRegistrationItem' }
        nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$' }
    AdminRegistrationDecision:
      type: object
      additionalProperties: false
      required: [registrationId, accountStatus, decidedAt]
      description: "[REQ-APR9-003, STATE-ACCT9-001] Resultado de la decision; accountStatus es el estado destino."
      properties:
        registrationId: { $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/Uuid' }
        accountStatus: { type: string, enum: [ACTIVE, REJECTED] }
        decidedAt: { type: string, format: date-time, description: "Marca de tiempo de la decision (ClockPort)" }
    AdminParameterKey:
      type: string
      enum: [album.max_photos_per_pet, scene.enabled, scene.global_quota_max, scene.provider_model, scene.provider_location, scene.prompt.blocks]
      description: >
        [REQ-CFG9-001, REQ-CFG9-008] Catalogo CERRADO del codigo (app-config.ts / ParameterDefaults); cada clave se corresponde con una fila de
        platform_parameters (005, sin cambio de forma, MER-09). Una clave nueva exige tocar dominio, siembra y este contrato. Tipo, defecto y
        restricciones: album.max_photos_per_pet = entero, defecto 10, 1..50 (catalogo de 005); scene.enabled = booleano, defecto true;
        scene.global_quota_max = entero, defecto 5, minimo 1 y techo de codigo (hoy 1000; en 5b pasa a derivarse de la tabla de costes,
        T1300); scene.provider_model = texto, lista cerrada de 3 modelos (gemini-2.5-flash-image, gemini-3.1-flash-image, gemini-3-pro-image)
        y regex cerrada del codigo, defecto gemini-2.5-flash-image; scene.provider_location = texto, lista cerrada de regiones de codigo
        (SCENE_ALLOWED_LOCATIONS) mas global solo tras el dictamen de /rama (D9-23), defecto us-central1; scene.prompt.blocks = un unico JSON de
        bloques nombrados genericos (STYLE_BASE_TEXT, hogar con foto, hogar generico, PRESERVATION_BLOCK, PIXEL_REDRAW_RULE, STYLE_CLOSING),
        con longitud maxima por bloque y conjunto cerrado de marcadores del codigo (INV-CFG9-002; los numeros y los nombres exactos los fija T1261/T1303,
        no este contrato), defecto el texto vigente tras #57. scene.global_quota_used.YYYY-MM es un contador interno y NO esta en el catalogo.
    AdminParameterConstraints:
      type: object
      additionalProperties: false
      description: "[REQ-CFG9-007] Restricciones del catalogo de codigo para la clave (la interfaz no las duplica). Solo aparecen las que aplican al tipo."
      properties:
        min: { type: integer, description: "Minimo inclusivo (claves enteras)" }
        max: { type: integer, description: "Maximo inclusivo (claves enteras); para scene.global_quota_max es el techo vigente de codigo" }
        allowed:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 64 }
          description: "Lista cerrada de valores admitidos (booleano: true y false; modelo; region). Un valor fuera de la lista se rechaza aunque cumpla la regex (INV-CFG9-001)"
        maxBlockLength: { type: integer, minimum: 1, description: "Longitud maxima de cada bloque de scene.prompt.blocks (valor de codigo; lo fija T1261/T1303)" }
    AdminParameterView:
      type: object
      additionalProperties: false
      required: [key, valueType, value, default, source, constraints, writable, lastEditedAt, lastEditedBy, etag]
      description: >
        [REQ-CFG9-001, REQ-CFG9-007] Vista cerrada de un parametro. No incluye updated_by_user_id ni ningun id de cuenta de usuario: el
        autor es el id de admin_identities de la ultima entrada de admin_audit_entries (MER-09). No incluye valores de otros parametros.
      properties:
        key: { $ref: '#/components/schemas/AdminParameterKey' }
        valueType: { type: string, enum: [INTEGER, BOOLEAN, STRING, JSON_BLOCKS], description: "Interpretacion del texto canonico de value" }
        value:
          type: string
          minLength: 1
          maxLength: 16384
          description: "Valor EFECTIVO en texto canonico (el de la fila si es valido; si no, el defecto, y source = DEFAULT). Entero sin signo ni espacios; booleano true o false en minusculas"
        default: { type: string, minLength: 1, maxLength: 16384, description: "Defecto del codigo (unica fuente cuando la fila falta o es invalida, INV-CFG9-003)" }
        source: { type: string, enum: [DATABASE, DEFAULT], description: "DATABASE si rige la fila; DEFAULT si la fila falta o es invalida (se registra un aviso sin valor)" }
        constraints: { $ref: '#/components/schemas/AdminParameterConstraints' }
        writable:
          type: boolean
          description: "false para las claves cuya escritura se habilita en la subfase 5b (P5-06 = B: scene.global_quota_max, scene.provider_model, scene.provider_location, scene.prompt.blocks); el dato es de la respuesta, no de la forma, y cambia a true en 5b sin cambiar este contrato"
        lastEditedAt:
          type: [string, 'null']
          format: date-time
          description: "platform_parameters.updated_at de la fila; null si la fila no existe"
        lastEditedBy:
          type: [string, 'null']
          minLength: 1
          maxLength: 64
          description: "Id opaco del administrador (el mismo de AdminSessionView.adminId) de la ultima entrada de admin_audit_entries para esta clave; null si nunca se edito desde /admin. Nunca es un userId de usuario"
        etag: { type: string, pattern: '^"[A-Za-z0-9_-]{8,64}"$', description: "Etiqueta opaca de la version vigente de la fila (cambia con cada escritura, tambien si el valor escrito es igual); se envia tal cual en If-Match. Una fila ausente tiene la etiqueta de ausencia" }
    AdminParameterCatalog:
      type: object
      additionalProperties: false
      required: [items]
      description: "[REQ-CFG9-001] Siempre las seis claves del catalogo, en orden fijo del codigo; sin paginacion."
      properties:
        items:
          type: array
          minItems: 6
          maxItems: 6
          items: { $ref: '#/components/schemas/AdminParameterView' }
    AdminParameterWriteInput:
      type: object
      additionalProperties: false
      required: [value]
      description: "[REQ-CFG9-007] Cuerpo cerrado: solo el valor en texto canonico. La clave va en la ruta; no se envian tipo, rango, autor ni fecha."
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 16384
          description: "Texto canonico EXACTO, sin recortar ni normalizar: ' 12 ', 12.5, 0, -1, abc o 51 para album.max_photos_per_pet son ERR-SCHEMA-VALIDATION-FAILED. maxLength es una cota de transporte; la restriccion real de cada clave es el catalogo de codigo (constraints)"
    AdminQuotaResetResult:
      type: object
      additionalProperties: false
      required: [accountsReset, resetAt]
      description: "[REQ-CFG9-006] Resultado del reinicio. No identifica cuentas ni expone contadores."
      properties:
        accountsReset: { type: integer, minimum: 0, maximum: 100, description: "Cuentas de usuario del administrador cuyo contador quedo en cero (0 si ninguna cuenta coincide)" }
        resetAt: { type: string, format: date-time, description: "Marca de tiempo del reinicio (ClockPort)" }
    DeletionReauthStarted:
      type: object
      additionalProperties: false
      required: [authorizationUrl]
      description: "[REQ-DEL9-001] Misma forma que la vista de autorizacion de Google de 008: la URL no se registra."
      properties:
        authorizationUrl:
          type: string
          format: uri
          pattern: '^https://accounts\.google\.com/'
          description: "URL de autorizacion de Google (state, nonce, PKCE S256, max_age); no se registra"
    DeleteAccountWithGoogleInput:
      type: object
      additionalProperties: false
      required: [confirmationPhrase]
      description: "[REQ-DEL9-001, REQ-ACC-002 (3)] El cuerpo es cerrado: no admite contrasena, sub, correo ni prueba de titularidad (la prueba vive en el servidor, ligada a la sesion)."
      properties:
        confirmationPhrase:
          type: string
          const: 'ELIMINAR MI CUENTA'
          description: "Literal, sensible a mayusculas y sin recortar; cualquier otra cosa es ERR-SCHEMA-VALIDATION-FAILED (422)"
        backupConfirmationToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: "Opcional a nivel de esquema a proposito, igual que en deleteAccount de 004: la forma se valida en el servidor y su ausencia, caducidad, uso previo o ajenidad responden ERR-ACCOUNT-CONFIRMATION-MISMATCH. Decision abierta para Neo (ver description de la operacion)."
    HouseholdsActiveProblem:
      type: object
      additionalProperties: false
      required: [type, code, title, status, detail, invariantRef, households]
      description: "[D9-24 = A, EDGE-009-049] Extension CERRADA de ProblemDetails (RFC 9457 admite miembros de extension): los mismos campos y ademas la lista estructurada de hogares afectados. ProblemDetails es cerrado y no se puede ampliar con allOf, por eso se repiten sus campos."
      properties:
        type: { type: string, const: 'urn:argos:error:ERR-ACCOUNT-DELETE-HOUSEHOLDS-ACTIVE' }
        code: { type: string, const: 'ERR-ACCOUNT-DELETE-HOUSEHOLDS-ACTIVE' }
        title: { type: string }
        status: { type: integer, const: 409 }
        detail: { type: string }
        invariantRef: { type: string }
        field: { type: [string, 'null'] }
        instance: { type: [string, 'null'] }
        households:
          type: array
          minItems: 1
          maxItems: 100
          description: "Hogares de los que la persona es propietaria y que tienen otros miembros ACTIVE o mascotas compartidas. Solo ve los suyos."
          items:
            type: object
            additionalProperties: false
            required: [householdId, name, activeMembers, sharedPets]
            properties:
              householdId: { $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/Uuid' }
              name: { type: string, minLength: 1, maxLength: 100 }
              activeMembers: { type: integer, minimum: 1, description: "Otros miembros ACTIVE (sin contar a la persona)" }
              sharedPets: { type: integer, minimum: 0, description: "Mascotas de la persona asignadas a ese hogar" }
