openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Argos Pet Health & Biometric Tracker API - delta de la feature 009 (administracion y borrado de cuenta sin contrasena)
  version: 1.3.0
  description: >
    Documento INCREMENTAL y UNICO de la feature 009 (P5-05 = A): contiene solo operaciones nuevas; los OpenAPI de 004 (3.4.0),
    005 y 006 permanecen sin cambio, y deleteAccount de 004 no se edita. Version 1.0.0 (T1217): dos operaciones de USUARIO del
    borrado de una cuenta sin contrasena con reautenticacion reciente con Google (D9-17 = A, REQ-DEL9-001, INV-DEL9-001): inicio de
    la reautenticacion y borrado. Las rutas de /api/admin/* se agregan en este mismo archivo: T1226 (1.1.0) declara el acceso
    con Google de administracion, la sesion y el contador de pendientes; registros de cuentas (T1241, 1.3.0: lista paginada, aprobar, rechazar) y parametros (T1256, pendiente). Esquemas inline y cerrados
    (additionalProperties: false); errores en application/problem+json (RFC 9457) del catalogo incremental de 009 y de los
    catalogos heredados. Las cookies de administracion (argos_admin_session, argos_admin_oauth) solo existen en las operaciones
    /admin/* y nunca autorizan las dos operaciones de usuario.
  x-sdd-status: DRAFT
  x-sdd-metadata:
    version: 1.3.0
    status: DRAFT
    supersedes: 1.2.0
    change_type: MINOR
    change_note_1_3_0: "1.3.0 (feature 009, T1241, Architect 2026-11-23, MINOR, DRAFT; el estado APPROVED de 1.2.0 NO se hereda: la 1.3.0 la ratifica solo Neo): +3 operaciones de /api/admin/registrations para la aprobacion de registro (#18): listAdminRegistrations (lista paginada por cursor de cuentas PENDING con menos de 30 dias, REQ-APR9-005, EDGE-009-039), approveAdminRegistration y rejectAdminRegistration (decision atomica PENDING -> ACTIVE|REJECTED con compare-and-set, STATE-ACCT9-001, REQ-APR9-003). El contador de pendientes es getAdminPendingCount (1.1.0), sin cambio. Las dos operaciones mutantes siguen la regla x-sdd-admin-mutation-csrf-order de 1.2.0 (403 ERR-AUTH-CSRF-REJECTED antes de resolver la sesion). Una decision sobre una solicitud purgada, inexistente, ya decidida o de mas de 30 dias responde 404 ERR-ADMIN-REGISTRATION-NOT-FOUND (application/problem+json, solo con sesion de administracion valida) sin revelar el estado previo ni distinguir los casos; sin sesion sigue el 404 uniforme text/plain. La lista y las respuestas no exponen correo ni sub (NFR-009-004). Sin codigos de error nuevos (ERR-ADMIN-REGISTRATION-NOT-FOUND ya existe en el catalogo 1.0.0). Parametros y coste (T1256) siguen pendientes. Decision soberana de Neo (Nivel 2, 2026-11-23): se ELIMINA la supresion anticipada manual por canal de contacto; la operacion suppressAdminRegistration y sus esquemas se retiraron ANTES de la ratificacion de 1.3.0 (no hay version publicada que la contenga, por eso no se incrementa la version); la solicitud se purga solo automaticamente a los 30 dias (REQ-APR9-007)."
    change_note: "1.0.0 (feature 009, T1217, Architect 2026-11-23): documento nuevo con 2 operaciones de usuario (startAccountDeletionReauth, deleteAccountWithGoogleReauth). La prueba de titularidad es la reautenticacion reciente con Google (nueva intencion de flujo DELETE de oauth_flow_states, max_age, mismo sub vinculado, un solo uso, 900 s) mas la confirmacion explicita; el callback es el de 008 (/auth/google/callback) y NO se edita su contrato aqui (la intencion DELETE y su migracion son T1219). Efectos del borrado = cascada de REQ-ACC-002. D9-24 = A: se rechaza el borrado de una cuenta propietaria con hogares con miembros ACTIVE o mascotas compartidas, sin transferencia automatica. /api/admin/* pendiente de T1226/T1241/T1256."
    traceability: [REQ-DEL9-001, INV-DEL9-001, REQ-ACC-002, EDGE-009-031, EDGE-009-032, EDGE-009-049, REQ-ADM9-001, REQ-ADM9-002, REQ-ADM9-003, REQ-ADM9-004, REQ-ADM9-005, REQ-ADM9-006, REQ-APR9-005, INV-ADM9-001, INV-ADM9-002, EDGE-009-008, EDGE-009-009, EDGE-009-010, EDGE-009-011, EDGE-009-013, EDGE-009-034, EDGE-009-035, EDGE-009-040, EDGE-009-047, REQ-APR9-001, REQ-APR9-003, REQ-APR9-007, STATE-ACCT9-001, EDGE-009-038, EDGE-009-039, NFR-009-004]
    change_note_1_2_0: "1.2.0 (feature 009, Architect 2026-11-23, MINOR; decision (g) de Neo en Logos): regla transversal x-sdd-admin-mutation-csrf-order: Toda operacion mutante de /api/admin/* sin la cabecera global X-Argos-Request: 1 responde 403 ERR-AUTH-CSRF-REJECTED ANTES de resolver la sesion de administracion (coherente con INV-AUTH-007), con independencia de que haya sesion o no, de modo que no revela su existencia; el 404 uniforme solo aplica despues, a la peticion que si lleva la cabecera y no tiene sesion. Efecto en endAdminSession: sin sesion y sin X-Argos-Request pasa de 404 uniforme a 403 ERR-AUTH-CSRF-REJECTED (la peticion con cabecera y sin sesion sigue en 404 uniforme). Aplica tambien a las operaciones mutantes de /admin/* de T1241 y T1256. Sin operaciones ni codigos nuevos; cambio de comportamiento de una respuesta de 1.1.0, por eso MINOR y no PATCH. El origen (Origin) se valida DESPUES de la sesion, no antes: su fallo sin sesion permanece como 404 uniforme para no filtrar la existencia de la ruta; la regla 403 aplica solo a la ausencia de X-Argos-Request. Contrato y plan (ADR-009-07) APROBADOS por Neo (Nivel 2) el 2026-11-23, comunicado por Morpheus; el estado formal APPROVED/LOCKED lo fija solo Neo, igual que en 1.1.0. APPROVED por Neo (Logos, 2026-11-23)."
    x-sdd-admin-mutation-csrf-order: "Toda operacion mutante de /api/admin/* sin la cabecera global X-Argos-Request: 1 responde 403 ERR-AUTH-CSRF-REJECTED ANTES de resolver la sesion de administracion (coherente con INV-AUTH-007), con independencia de que haya sesion o no, de modo que no revela su existencia; el 404 uniforme solo aplica despues, a la peticion que si lleva la cabecera y no tiene sesion"
    change_note_1_1_0: "1.1.0 (feature 009, T1226, Architect 2026-11-23, MINOR): +5 operaciones de /api/admin/* de la Fase 3 (#19): inicio y callback del flujo OIDC de administracion con Google, lectura y cierre de la sesion de administracion y contador de pendientes. Esquemas inline cerrados; 404 uniforme (text/plain 'Not Found', identico al de una ruta inexistente de /api/) para toda ruta sin sesion de administracion y para todo fallo del callback (correo fuera de la lista, no verificado, state reutilizado, sub distinto del anclado); 429 ERR-ADMIN-RATE-LIMITED solo en inicio y callback (EDGE-009-035, ADR-009-15, D9-25). Sin codigos de error nuevos. Las dos operaciones de borrado de usuario de 1.0.0 no cambian. Depende de la Enmienda 009-A (T1224/T1225, pendiente de firma de Neo) para cookies, Path y jose. Pendientes: aprobar/rechazar y lista de PENDING (T1241), parametros y coste (T1256)."
servers:
  - url: http://127.0.0.1:3100/api
    description: Servidor local (prefijo /api)
security:
  - sessionCookie: []
tags:
  - name: account-deletion
  - name: admin-auth
  - name: admin-portal
  - name: admin-registrations

paths:
  /account/deletion/reauth:
    post:
      tags: [account-deletion]
      operationId: startAccountDeletionReauth
      summary: "Inicia la reautenticacion reciente con Google para eliminar una cuenta sin contrasena: devuelve la URL de autorizacion con max_age y fija la cookie argos_oauth con intencion DELETE [REQ-DEL9-001, INV-DEL9-001]"
      description: >
        Solo para una cuenta sin contrasena (authMethods.hasPassword = false) con Google vinculado; para una cuenta con contrasena
        responde el mismo 403 uniforme ERR-ACCOUNT-DELETE-REAUTH-REQUIRED (el borrado por contrasena de deleteAccount no cambia,
        EDGE-009-032). Guarda en el servidor la intencion DELETE con el id de usuario, el sub vinculado y el resumen SHA-256 de la
        sesion de origen (nunca el token); la cookie argos_oauth (HttpOnly, SameSite=Lax, Path=/api/auth/google, Max-Age 900 s,
        Secure en Cloud) lleva solo un identificador opaco. La URL de Google lleva state, nonce, PKCE S256 y max_age, y la URI de
        redireccion es la fija de 008. Al volver, el callback de 008 comprueba que el sub verificado coincide con el vinculado a la
        sesion y que la autenticacion es reciente, y deja registrada una prueba de titularidad de UN SOLO USO, ligada a esa sesion y
        vigente 900 s; no emite Set-Cookie argos_session ni elimina nada. Cualquier fallo del flujo se resuelve en el contrato de 008
        (ERR-AUTH-GOOGLE-FAILED); aqui solo se pide la prueba.
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-DEL9-001, INV-DEL9-001, EDGE-009-031, EDGE-009-032]
      x-sdd-error-order: [ERR-AUTH-CSRF-REJECTED, ERR-AUTH-UNAUTHENTICATED, ERR-ACCOUNT-DELETE-REAUTH-REQUIRED, ERR-RATE-LIMITED]
      x-sdd-rate-limit: "GOOGLE_LINK_MAX_PER_WINDOW por GOOGLE_LINK_WINDOW_MINUTES y por usuario (configurable en src/infrastructure/config/; ERR-RATE-LIMITED); sin valores nuevos en esta tarea"
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: false
        description: "Sin cuerpo. Cualquier cuerpo no vacio se rechaza (ERR-SCHEMA-VALIDATION-FAILED)."
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200':
          description: "URL de autorizacion de Google; Set-Cookie argos_oauth con intencion DELETE"
          headers:
            Set-Cookie: { $ref: '#/components/headers/OAuthStateCookie' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionReauthStarted' }
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: "ERR-AUTH-CSRF-REJECTED (falta X-Argos-Request) o ERR-ACCOUNT-DELETE-REAUTH-REQUIRED (la cuenta no puede usar esta via: tiene contrasena o no tiene Google vinculado; mismo codigo, estado y detalle que el resto de fallos de titularidad)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /account/deletion/google:
    post:
      tags: [account-deletion]
      operationId: deleteAccountWithGoogleReauth
      summary: "Elimina una cuenta sin contrasena: consume la prueba de titularidad de un solo uso y la frase literal; mismos efectos que REQ-ACC-002 [REQ-DEL9-001, INV-DEL9-001, EDGE-009-049]"
      description: >
        Una sesion por si sola no elimina nada (INV-DEL9-001). Fase A (sin escrituras): valida CSRF, sesion y esquema; A2 comprueba
        que la cuenta no tiene contrasena y que existe una prueba de titularidad vigente (900 s), no consumida, ligada a ESTA sesion
        y al sub vinculado; si no, ERR-ACCOUNT-DELETE-REAUTH-REQUIRED (uniforme: no distingue ausente, vencida, reutilizada o ajena, ni
        revela el sub o el correo). Fase B (una transaccion): consume la prueba con un UPDATE condicional (exactamente 1 fila), relee
        el rechazo por hogares (D9-24 = A: ERR-ACCOUNT-DELETE-HOUSEHOLDS-ACTIVE, 409, con la lista de hogares afectados, sin
        transferencia automatica de propiedad; un fallo revierte todo, incluido el consumo de la prueba, que sigue vigente hasta su
        vencimiento y no se pierde ningun dato) y aplica la cascada de REQ-ACC-002 (datos de la cuenta, mascotas y registros, medios,
        auth_identities, estados de flujo, sesiones, hogares de un unico miembro) con una sola fila de auditoria ACCOUNT_DELETE
        (seudonimo HMAC del userId, REQ-AUD-001). backupConfirmationToken conserva la semantica de REQ-ACC-002 (5) y de deleteAccount de
        004: se obtiene con exportBackup, es de un solo uso y caduca a los 10 min; ausente, mal formado, caducado, usado o ajeno =
        ERR-ACCOUNT-CONFIRMATION-MISMATCH (409, heredado de 004), nunca ERR-SCHEMA-VALIDATION-FAILED. DECISION ABIERTA para Neo en
        T1217: si la via Google debe exigir ese token de respaldo (se declara opcional en el esquema, como en 004, hasta que
        se confirme).
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-DEL9-001, INV-DEL9-001, REQ-ACC-002, EDGE-009-031, EDGE-009-032, EDGE-009-049]
      x-sdd-error-order: [ERR-AUTH-CSRF-REJECTED, ERR-AUTH-UNAUTHENTICATED, ERR-SCHEMA-VALIDATION-FAILED, ERR-ACCOUNT-DELETE-REAUTH-REQUIRED, ERR-ACCOUNT-CONFIRMATION-MISMATCH, ERR-ACCOUNT-DELETE-HOUSEHOLDS-ACTIVE]
      x-sdd-rate-limit: "Reutiliza el limite de la operacion de borrado vigente por usuario (ERR-RATE-LIMITED); sin valores nuevos en esta tarea"
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountWithGoogleInput' }
      responses:
        '204':
          description: "Cuenta eliminada; la cookie argos_session se expira"
          headers:
            Set-Cookie: { $ref: '#/components/headers/ExpiredCookie' }
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: "ERR-AUTH-CSRF-REJECTED o ERR-ACCOUNT-DELETE-REAUTH-REQUIRED (prueba de titularidad ausente, vencida, ya consumida o ajena; cuenta con contrasena)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '409':
          description: "ERR-ACCOUNT-DELETE-HOUSEHOLDS-ACTIVE (D9-24 = A: lista de hogares afectados; nada se borra) o ERR-ACCOUNT-CONFIRMATION-MISMATCH (token de respaldo, heredado de 004)"
          content:
            application/problem+json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/HouseholdsActiveProblem' }
                  - { $ref: '#/components/schemas/ProblemDetails' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /admin/auth/google/start:
    get:
      tags: [admin-auth]
      operationId: startAdminGoogleLogin
      security: []
      summary: "Inicia el flujo OIDC de administracion con Google: 302 a Google y cookie argos_admin_oauth [REQ-ADM9-006, EDGE-009-035]"
      description: >
        Navegacion de la pantalla estatica GET /admin (GET sin cuerpo, sin sesion, sin parametros: nada del cliente entra en la URL de
        Google). El estado real del flujo (state, nonce, verificador PKCE S256, expires_at 900 s) vive en el servidor en un almacen
        PROPIO de administracion, distinto de oauth_flow_states de usuarios; la cookie argos_admin_oauth lleva solo un identificador
        opaco de un solo uso (HttpOnly, SameSite=Lax, Path=/api/admin/auth/google, Max-Age 900 s, Secure en Cloud). La URI de
        redireccion es la fija por entorno /api/admin/auth/google/callback, nunca derivada de Host. No consulta la lista de
        administradores (no revela nada). Cuenta contra el limite por IP efectiva de EDGE-009-035 (trustProxy de 1 salto); superado
        el limite responde 429 ERR-ADMIN-RATE-LIMITED con Retry-After. No toca argos_session ni argos_oauth ni crea cuentas de usuario.
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ADM9-006, REQ-ADM9-004, INV-ADM9-001, EDGE-009-010, EDGE-009-035]
      x-sdd-rbac-action: "PLATFORM_ADMIN_LOGIN_START"
      x-sdd-rbac-scope: "plataforma; PLATFORM_ADMIN nunca entra en can(rol, accion) de hogar (INV-ADM9-001)"
      x-sdd-error-order: [ERR-ADMIN-RATE-LIMITED, ERR-INTERNAL-UNEXPECTED]
      x-sdd-rate-limit: "Fallos de acceso de administracion por IP efectiva y ventana (D9-25: 10 fallos en 15 min; valores solo en app-config.ts, ADR-009-15); ERR-ADMIN-RATE-LIMITED con Retry-After; nunca por cuenta ni a sesiones validas"
      responses:
        '302':
          description: "Redireccion a https://accounts.google.com/... (state, nonce, PKCE S256); Set-Cookie argos_admin_oauth; la URL no se registra"
          headers:
            Location: { description: "https://accounts.google.com/...; no se registra", schema: { type: string, format: uri, pattern: '^https://accounts\.google\.com/' } }
            Set-Cookie: { $ref: '#/components/headers/AdminOAuthCookie' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '429': { $ref: '#/components/responses/AdminRateLimited' }
        '500': { $ref: '#/components/responses/Problem' }

  /admin/auth/google/callback:
    get:
      tags: [admin-auth]
      operationId: completeAdminGoogleLogin
      security: []
      summary: "Callback del flujo OIDC de administracion: valida state, nonce, PKCE, id_token, lista cerrada de correos y sub anclado; emite argos_admin_session o 404 uniforme [REQ-ADM9-002, REQ-ADM9-003, REQ-ADM9-006]"
      description: >
        Valida state y nonce contra la cookie argos_admin_oauth (de un solo uso), canjea el codigo con PKCE y verifica del id_token la
        firma (JWKS de Google, jose 6.2.17 en google-oidc-verify.ts, Enmienda 009-A), iss, aud, exp, nonce y email_verified = true. El
        acceso exige correo verificado EN la lista cerrada de correos de configuracion (app-config.ts / Secret Manager / variable de
        entorno; no editable desde la interfaz) y, si ya hay un sub anclado, sub IGUAL al anclado (EDGE-009-047); el primer acceso
        ancla el sub. Exito: 200 con una pagina sin script en linea (CSP de pagina, como el callback de 008) que navega a /admin,
        con Set-Cookie argos_admin_session (HttpOnly, SameSite=Strict, Path=/api/admin, Secure en Cloud, 30 min absolutos y 10 min de
        inactividad) con identificador NUEVO (rotacion en el callback); la cookie Strict se fija en una respuesta 200 y no en un 302
        cross-site. Cualquier fallo (state ausente, reutilizado o vencido; codigo o id_token invalido; correo no verificado; correo
        fuera de la lista; sub distinto del anclado; cancelacion) responde el MISMO 404 uniforme que una ruta inexistente, sin
        distinguir la causa ni revelar la lista (EDGE-009-008, EDGE-009-034); cuenta contra el limite por IP efectiva y, al superarlo,
        429 ERR-ADMIN-RATE-LIMITED con Retry-After (EDGE-009-035). No crea ni modifica ninguna cuenta de usuario, no emite
        argos_session y una cuenta de usuario PENDING no impide el acceso (EDGE-009-013). Consume la cookie argos_admin_oauth (se expira).
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ADM9-002, REQ-ADM9-003, REQ-ADM9-006, REQ-ADM9-004, INV-ADM9-001, INV-ADM9-002, EDGE-009-008, EDGE-009-009, EDGE-009-010, EDGE-009-034, EDGE-009-035, EDGE-009-047]
      x-sdd-rbac-action: "PLATFORM_ADMIN_LOGIN_COMPLETE"
      x-sdd-rbac-scope: "plataforma; PLATFORM_ADMIN nunca entra en can(rol, accion) de hogar (INV-ADM9-001)"
      x-sdd-error-order: [ERR-ADMIN-RATE-LIMITED, ERR-INTERNAL-UNEXPECTED]
      x-sdd-rate-limit: "Igual que startAdminGoogleLogin: los fallos de inicio y callback comparten la ventana por IP efectiva (D9-25; app-config.ts)"
      parameters:
        - name: code
          in: query
          required: false
          description: "Codigo de autorizacion de Google; cualquier parametro ausente o malformado produce el 404 uniforme, no un 422"
          schema: { type: string, maxLength: 2048 }
        - name: state
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
        - name: error
          in: query
          required: false
          description: "Cancelacion o rechazo en Google; produce el 404 uniforme"
          schema: { type: string, maxLength: 256 }
      responses:
        '200':
          description: "Acceso concedido: pagina de navegacion sin script en linea; Set-Cookie argos_admin_session (id nuevo) y expiracion de argos_admin_oauth"
          headers:
            Set-Cookie: { $ref: '#/components/headers/AdminSessionCookie' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            text/html:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFoundUniform' }
        '429': { $ref: '#/components/responses/AdminRateLimited' }
        '500': { $ref: '#/components/responses/Problem' }

  /admin/session:
    get:
      tags: [admin-portal]
      operationId: getAdminSession
      security:
        - adminSessionCookie: []
      summary: "Estado de la sesion de administracion vigente [REQ-ADM9-002, EDGE-009-047]"
      description: >
        Solo con argos_admin_session valida. En cada peticion de /api/admin/* se revalida que el correo de la sesion siga en la lista
        vigente; si no, la sesion se revoca y la respuesta es el 404 uniforme (EDGE-009-047). Sin cookie, con cookie vencida, revocada
        o ajena, o con una cookie de USUARIO (argos_session), responde el MISMO 404 uniforme que una ruta inexistente: cuerpo,
        cabeceras y secuencia de puertos identicos, y tiempo de respuesta independiente de la existencia de sesion (EDGE-009-008,
        INV-ADM9-002). Esta lectura NO renueva la inactividad (propuesta de /architect a confirmar en T1229; evita un keep-alive por
        sondeo); las acciones de mutacion si la renuevan. Nunca devuelve el correo ni el sub.
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ADM9-001, REQ-ADM9-002, INV-ADM9-002, EDGE-009-008, EDGE-009-047]
      x-sdd-rbac-action: "PLATFORM_ADMIN_SESSION_READ"
      x-sdd-rbac-scope: "plataforma; PLATFORM_ADMIN nunca entra en can(rol, accion) de hogar (INV-ADM9-001)"
      x-sdd-error-order: [ERR-INTERNAL-UNEXPECTED]
      responses:
        '200':
          description: "Sesion de administracion vigente"
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSessionView' }
        '404': { $ref: '#/components/responses/NotFoundUniform' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [admin-portal]
      operationId: endAdminSession
      security:
        - adminSessionCookie: []
      summary: "Cierre de sesion explicito de administracion: revoca la sesion y expira argos_admin_session [REQ-ADM9-002, EDGE-009-047]"
      description: >
        Orden (decision (g) de Neo, INV-AUTH-007): PRIMERO se verifica la cabecera X-Argos-Request: 1 (REQ-ADM9-005); si falta, responde 403 ERR-AUTH-CSRF-REJECTED ANTES de resolver la sesion de administracion, haya sesion o no (no revela su existencia) y no revoca. Solo despues se exige argos_admin_session valida; sin ella, el 404 uniforme. El origen (cabecera Origin igual al propio) se valida DESPUES de la sesion, para que su fallo sin sesion siga siendo el 404 uniforme y no revele la existencia; con sesion, un origen ajeno responde 403 ERR-AUTH-CSRF-REJECTED.
        Con sesion valida y CSRF correcto revoca la sesion en el servidor (no solo expira la cookie) y registra la accion en
        admin_audit_entries (id de administrador y marca de tiempo; REQ-ADM9-004). Idempotente en efecto: una segunda llamada ya no
        tiene sesion y recibe el 404 uniforme. No afecta a argos_session.
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-ADM9-002, REQ-ADM9-004, REQ-ADM9-005, INV-ADM9-002, EDGE-009-011, EDGE-009-047]
      x-sdd-rbac-action: "PLATFORM_ADMIN_SESSION_END"
      x-sdd-rbac-scope: "plataforma; PLATFORM_ADMIN nunca entra en can(rol, accion) de hogar (INV-ADM9-001)"
      x-sdd-error-order: [ERR-AUTH-CSRF-REJECTED, ERR-INTERNAL-UNEXPECTED]
      x-sdd-csrf-before-session: true
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204':
          description: "Sesion revocada; la cookie argos_admin_session se expira"
          headers:
            Set-Cookie: { $ref: '#/components/headers/AdminSessionExpiredCookie' }
        '403':
          description: "ERR-AUTH-CSRF-REJECTED: falta X-Argos-Request; se responde antes de resolver la sesion de administracion, con o sin ella (INV-AUTH-007). Un origen ajeno se valida despues de la sesion: sin sesion sigue siendo 404 uniforme"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '404': { $ref: '#/components/responses/NotFoundUniform' }
        '500': { $ref: '#/components/responses/Problem' }

  /admin/pending-count:
    get:
      tags: [admin-portal]
      operationId: getAdminPendingCount
      security:
        - adminSessionCookie: []
      summary: "Contador de cuentas PENDING y aviso de umbral, que se muestra al entrar a /admin (D9-01 = A) [REQ-APR9-005, EDGE-009-040]"
      description: >
        Solo con argos_admin_session valida; sin ella, el 404 uniforme. Devuelve cuantas cuentas estan en PENDING (STATE-ACCT9-001) y
        si superan el umbral de aviso aprobado (D9-25, valor solo en app-config.ts; el umbral numerico NO se expone). La lista
        paginada y las acciones aprobar y rechazar son de T1241 y no estan en esta version. No modifica estado ni se audita.
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-APR9-005, REQ-ADM9-001, INV-ADM9-002, EDGE-009-040]
      x-sdd-rbac-action: "PLATFORM_ADMIN_PENDING_COUNT_READ"
      x-sdd-rbac-scope: "plataforma; PLATFORM_ADMIN nunca entra en can(rol, accion) de hogar (INV-ADM9-001)"
      x-sdd-error-order: [ERR-INTERNAL-UNEXPECTED]
      responses:
        '200':
          description: "Contador de pendientes"
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPendingCount' }
        '404': { $ref: '#/components/responses/NotFoundUniform' }
        '500': { $ref: '#/components/responses/Problem' }

  /admin/registrations:
    get:
      tags: [admin-registrations]
      operationId: listAdminRegistrations
      security:
        - adminSessionCookie: []
      summary: "Lista paginada de cuentas PENDING (menos de 30 dias) para decidir desde /admin [REQ-APR9-005, EDGE-009-039]"
      description: >
        Solo con argos_admin_session valida; sin ella, el 404 uniforme (EDGE-009-008). Vista paginada por cursor opaco, orden fijo por
        requestedAt ascendente y desempate por registrationId; cada elemento lleva username, fecha de solicitud y metodo de registro
        (PASSWORD o GOOGLE) y nunca correo, sub ni identificadores de sesion (NFR-009-004). Solo muestra cuentas en PENDING con menos de
        30 dias desde su creacion: una PENDING mas antigua aun no purgada no aparece ni se puede aprobar (EDGE-009-039). Es lectura:
        no modifica estado, no renueva la inactividad (igual que getAdminSession) y no se audita. El contador y el aviso de umbral son
        getAdminPendingCount (1.1.0).
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-APR9-005, REQ-ADM9-001, INV-ADM9-002, EDGE-009-008, EDGE-009-039]
      x-sdd-rbac-action: "PLATFORM_ADMIN_REGISTRATION_LIST"
      x-sdd-rbac-scope: "plataforma; PLATFORM_ADMIN nunca entra en can(rol, accion) de hogar (INV-ADM9-001)"
      x-sdd-error-order: [ERR-SCHEMA-VALIDATION-FAILED, ERR-INTERNAL-UNEXPECTED]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          description: "Elementos por pagina (1 a 50, por defecto 20)"
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$' }
          description: "Cursor opaco devuelto en nextCursor; un cursor invalido responde ERR-SCHEMA-VALIDATION-FAILED (422)"
      responses:
        '200':
          description: "Pagina de solicitudes pendientes"
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRegistrationPage' }
        '404': { $ref: '#/components/responses/NotFoundUniform' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /admin/registrations/{registrationId}/approve:
    post:
      tags: [admin-registrations]
      operationId: approveAdminRegistration
      security:
        - adminSessionCookie: []
      summary: "Aprueba una solicitud: PENDING -> ACTIVE (compare-and-set) [REQ-APR9-003, STATE-ACCT9-001]"
      description: >
        Orden: X-Argos-Request (403 antes de la sesion, regla de 1.2.0), sesion de administracion (404 uniforme), validacion del identificador (422) y decision. Transicion atomica PENDING -> ACTIVE con compare-and-set sobre account_status y la fecha de creacion (EDGE-009-039): solo si la solicitud sigue PENDING y no supera 30 dias. Si otra via la decidio, la purga gano o no existe, responde 404 ERR-ADMIN-REGISTRATION-NOT-FOUND sin revelar el estado previo. Con dos administradores a la vez, uno gana y el otro recibe el mismo 404 (EDGE-009-002). Guarda la fecha y el id del administrador de la decision y deja entrada en admin_audit_entries con id de administrador, accion y marca de tiempo, sin correo ni sub (REQ-ADM9-004). No envia correo (D9-04 iv) y no crea sesion: la persona inicia sesion luego.
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-APR9-003, REQ-APR9-005, REQ-ADM9-004, REQ-ADM9-005, INV-ADM9-001, INV-ADM9-002, STATE-ACCT9-001, EDGE-009-002, EDGE-009-038, EDGE-009-039]
      x-sdd-rbac-action: "PLATFORM_ADMIN_REGISTRATION_APPROVE"
      x-sdd-rbac-scope: "plataforma; PLATFORM_ADMIN nunca entra en can(rol, accion) de hogar (INV-ADM9-001)"
      x-sdd-error-order: [ERR-AUTH-CSRF-REJECTED, ERR-SCHEMA-VALIDATION-FAILED, ERR-ADMIN-REGISTRATION-NOT-FOUND, ERR-INTERNAL-UNEXPECTED]
      x-sdd-csrf-before-session: true
      x-sdd-audit: admin_audit_entries
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/RegistrationId' }
      responses:
        '200':
          description: "Solicitud aprobada: accountStatus ACTIVE"
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRegistrationDecision' }
        '403':
          description: "ERR-AUTH-CSRF-REJECTED: falta X-Argos-Request; se responde antes de resolver la sesion de administracion, con o sin ella (INV-AUTH-007). Un origen ajeno se valida despues de la sesion: sin sesion sigue siendo 404 uniforme"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '404': { $ref: '#/components/responses/RegistrationNotFound' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /admin/registrations/{registrationId}/reject:
    post:
      tags: [admin-registrations]
      operationId: rejectAdminRegistration
      security:
        - adminSessionCookie: []
      summary: "Rechaza una solicitud: PENDING -> REJECTED (compare-and-set); bloquea el reintento 30 dias [REQ-APR9-003, REQ-APR9-007, STATE-ACCT9-001]"
      description: >
        Mismo orden que approveAdminRegistration. Transicion atomica PENDING -> REJECTED con compare-and-set; revoca toda sesion de la cuenta como invariante (defensa en profundidad: una PENDING no tiene sesiones, EDGE-009-038) y conserva la fila 30 dias desde la decision, que ocupa el username o sub y bloquea el reintento hasta la purga (REQ-APR9-007). Si la solicitud ya no esta PENDING, fue purgada o no existe, responde 404 ERR-ADMIN-REGISTRATION-NOT-FOUND sin revelar el estado previo. Deja entrada en admin_audit_entries sin correo ni sub. No envia correo.
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-APR9-003, REQ-APR9-005, REQ-APR9-007, REQ-ADM9-004, REQ-ADM9-005, INV-ADM9-001, INV-ADM9-002, STATE-ACCT9-001, EDGE-009-003, EDGE-009-038, EDGE-009-039]
      x-sdd-rbac-action: "PLATFORM_ADMIN_REGISTRATION_REJECT"
      x-sdd-rbac-scope: "plataforma; PLATFORM_ADMIN nunca entra en can(rol, accion) de hogar (INV-ADM9-001)"
      x-sdd-error-order: [ERR-AUTH-CSRF-REJECTED, ERR-SCHEMA-VALIDATION-FAILED, ERR-ADMIN-REGISTRATION-NOT-FOUND, ERR-INTERNAL-UNEXPECTED]
      x-sdd-csrf-before-session: true
      x-sdd-audit: admin_audit_entries
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/RegistrationId' }
      responses:
        '200':
          description: "Solicitud rechazada: accountStatus REJECTED"
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRegistrationDecision' }
        '403':
          description: "ERR-AUTH-CSRF-REJECTED: falta X-Argos-Request; se responde antes de resolver la sesion de administracion, con o sin ella (INV-AUTH-007). Un origen ajeno se valida despues de la sesion: sin sesion sigue siendo 404 uniforme"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '404': { $ref: '#/components/responses/RegistrationNotFound' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argos_session
      description: Cookie de sesion de usuario de 002/004 (HttpOnly, SameSite=Strict). Las dos operaciones de esta version son de usuario; ninguna acepta la cookie de administracion.
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: argos_admin_session
      description: Cookie de sesion de ADMINISTRACION (HttpOnly, SameSite=Strict, Path=/api/admin; Enmienda 009-A). Solo la aceptan las operaciones /admin/*; nunca autoriza la API de usuarios, y argos_session nunca autoriza /admin/* (INV-ADM9-002).
  headers:
    AdminOAuthCookie:
      description: argos_admin_oauth=<id opaco>; HttpOnly; SameSite=Lax; Path=/api/admin/auth/google; Max-Age=900 (Secure en Cloud); de un solo uso. SameSite=Lax solo para esta cookie (Enmienda 009-A) porque una cookie Strict no viaja en la navegacion que vuelve desde Google
      schema: { type: string }
    AdminSessionCookie:
      description: "argos_admin_session=<id opaco de 32 bytes base64url, nuevo>; HttpOnly; SameSite=Strict; Path=/api/admin (Secure en Cloud); 30 min absolutos desde su creacion y 10 min de inactividad (Enmienda 009-A). Ademas argos_admin_oauth=; Max-Age=0 (se consume)"
      schema: { type: string }
    AdminSessionExpiredCookie:
      description: argos_admin_session=; HttpOnly; SameSite=Strict; Path=/api/admin; Max-Age=0
      schema: { type: string }
    NoStore:
      description: "Cache-Control: no-store"
      schema: { type: string, const: 'no-store' }
    OAuthStateCookie:
      description: argos_oauth=<id opaco>; HttpOnly; SameSite=Lax; Path=/api/auth/google; Max-Age=900 (Secure en Cloud); de un solo uso. Misma cookie de 008; la intencion DELETE vive en el estado del servidor, no en la cookie
      schema: { type: string }
    ExpiredCookie:
      description: argos_session=; HttpOnly; SameSite=Strict; Path=/; Max-Age=0
      schema: { type: string }
  parameters:
    CsrfHeader:
      name: X-Argos-Request
      in: header
      required: true
      description: >-
        La verificacion de X-Argos-Request se aplica a las operaciones que mutan estado; si falta, ERR-AUTH-CSRF-REJECTED (el origen se valida despues de la sesion). REGLA PARA TODA OPERACION MUTANTE de /api/admin/*: Toda operacion mutante de /api/admin/* sin la cabecera global X-Argos-Request: 1 responde 403 ERR-AUTH-CSRF-REJECTED ANTES de resolver la sesion de administracion (coherente con INV-AUTH-007), con independencia de que haya sesion o no, de modo que no revela su existencia; el 404 uniforme solo aplica despues, a la peticion que si lleva la cabecera y no tiene sesion. En endAdminSession, sin la cabecera responde 403 con o sin sesion; con la cabecera y sin sesion, 404 uniforme. Se valida antes que la sesion y no renueva actividad [INV-AUTH-007]
      schema: { type: string, const: '1' }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      description: "Identificador opaco de la solicitud (users.id de la cuenta PENDING o REJECTED); uno invalido responde ERR-SCHEMA-VALIDATION-FAILED (422) despues de la sesion"
      schema: { $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/Uuid' }
  responses:
    RegistrationNotFound:
      description: "ERR-ADMIN-REGISTRATION-NOT-FOUND (404 application/problem+json), SOLO con sesion de administracion valida: la solicitud no existe, fue purgada, ya fue decidida por otra via o supera 30 dias (compare-and-set perdido, EDGE-009-039). No revela el estado previo ni distingue los casos. Sin sesion de administracion NO se usa: sigue el 404 uniforme text/plain"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFoundUniform:
      description: >
        404 UNIFORME (EDGE-009-008, INV-ADM9-001): el mismo estado, cuerpo (text/plain 'Not Found'), cabeceras y secuencia de puertos
        que una ruta inexistente de /api/ (src/infrastructure/http/plugins/static-assets.ts), y con tiempo de respuesta independiente
        de la sesion. No es application/problem+json ni lleva codigo ERR-*: un codigo propio distinguiria la ruta de una inexistente.
        Cubre: sin sesion de administracion, sesion vencida, revocada o ajena, cookie de usuario, correo retirado de la lista y todo
        fallo del callback.
      content:
        text/plain:
          schema: { type: string, const: 'Not Found' }
    AdminRateLimited:
      description: "ERR-ADMIN-RATE-LIMITED (EDGE-009-035): demasiados fallos desde la IP efectiva en el flujo de Google de administracion; solo en inicio y callback"
      headers:
        Retry-After:
          description: Segundos hasta que expire la ventana de la IP efectiva (entero; valor derivado de app-config.ts, no escrito en el contrato)
          schema: { type: integer, minimum: 1 }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem:
      description: Error tipado del catalogo incremental de la 009 o de los catalogos heredados de 004, 005 y 006 (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    ProblemDetails:
      $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/ProblemDetails'
    AdminSessionView:
      type: object
      additionalProperties: false
      required: [authenticated, adminId, expiresAt, idleExpiresAt]
      description: "[REQ-ADM9-002] Vista cerrada de la sesion de administracion. No incluye correo, sub ni el identificador de sesion."
      properties:
        authenticated: { type: boolean, const: true }
        adminId:
          type: string
          minLength: 1
          maxLength: 64
          description: "Identificador opaco del administrador, el mismo que se registra en admin_audit_entries (REQ-ADM9-004); no es un userId de usuario"
        expiresAt: { type: string, format: date-time, description: "Fin absoluto de la sesion (30 min desde su creacion)" }
        idleExpiresAt: { type: string, format: date-time, description: "Fin por inactividad (10 min desde la ultima actividad), sin superar expiresAt" }
    AdminPendingCount:
      type: object
      additionalProperties: false
      required: [pending, warning]
      description: "[REQ-APR9-005, EDGE-009-040] Contador de cuentas PENDING; el umbral numerico de aviso no se expone."
      properties:
        pending: { type: integer, minimum: 0, description: "Cuentas en estado PENDING (STATE-ACCT9-001)" }
        warning: { type: boolean, description: "true si PENDING supera el umbral de aviso aprobado (D9-25, solo en app-config.ts)" }
    AdminRegistrationItem:
      type: object
      additionalProperties: false
      required: [registrationId, username, requestedAt, method]
      description: "[REQ-APR9-005] Solicitud PENDING en la lista de /admin. No incluye correo, sub, hash ni sesion (NFR-009-004)."
      properties:
        registrationId: { $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/Uuid' }
        username: { type: string, minLength: 1, maxLength: 254, description: "Username de la solicitud tal como se registro" }
        requestedAt: { type: string, format: date-time, description: "Fecha de la solicitud (users.created_at); base de la purga de 30 dias" }
        method: { type: string, enum: [PASSWORD, GOOGLE], description: "Metodo de registro (usuario y contrasena, o Google)" }
    AdminRegistrationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      description: "[REQ-APR9-005] Pagina de la lista de pendientes; nextCursor es null en la ultima pagina."
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AdminRegistrationItem' }
        nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$' }
    AdminRegistrationDecision:
      type: object
      additionalProperties: false
      required: [registrationId, accountStatus, decidedAt]
      description: "[REQ-APR9-003, STATE-ACCT9-001] Resultado de la decision; accountStatus es el estado destino."
      properties:
        registrationId: { $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/Uuid' }
        accountStatus: { type: string, enum: [ACTIVE, REJECTED] }
        decidedAt: { type: string, format: date-time, description: "Marca de tiempo de la decision (ClockPort)" }
    DeletionReauthStarted:
      type: object
      additionalProperties: false
      required: [authorizationUrl]
      description: "[REQ-DEL9-001] Misma forma que la vista de autorizacion de Google de 008: la URL no se registra."
      properties:
        authorizationUrl:
          type: string
          format: uri
          pattern: '^https://accounts\.google\.com/'
          description: "URL de autorizacion de Google (state, nonce, PKCE S256, max_age); no se registra"
    DeleteAccountWithGoogleInput:
      type: object
      additionalProperties: false
      required: [confirmationPhrase]
      description: "[REQ-DEL9-001, REQ-ACC-002 (3)] El cuerpo es cerrado: no admite contrasena, sub, correo ni prueba de titularidad (la prueba vive en el servidor, ligada a la sesion)."
      properties:
        confirmationPhrase:
          type: string
          const: 'ELIMINAR MI CUENTA'
          description: "Literal, sensible a mayusculas y sin recortar; cualquier otra cosa es ERR-SCHEMA-VALIDATION-FAILED (422)"
        backupConfirmationToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: "Opcional a nivel de esquema a proposito, igual que en deleteAccount de 004: la forma se valida en el servidor y su ausencia, caducidad, uso previo o ajenidad responden ERR-ACCOUNT-CONFIRMATION-MISMATCH. Decision abierta para Neo (ver description de la operacion)."
    HouseholdsActiveProblem:
      type: object
      additionalProperties: false
      required: [type, code, title, status, detail, invariantRef, households]
      description: "[D9-24 = A, EDGE-009-049] Extension CERRADA de ProblemDetails (RFC 9457 admite miembros de extension): los mismos campos y ademas la lista estructurada de hogares afectados. ProblemDetails es cerrado y no se puede ampliar con allOf, por eso se repiten sus campos."
      properties:
        type: { type: string, const: 'urn:argos:error:ERR-ACCOUNT-DELETE-HOUSEHOLDS-ACTIVE' }
        code: { type: string, const: 'ERR-ACCOUNT-DELETE-HOUSEHOLDS-ACTIVE' }
        title: { type: string }
        status: { type: integer, const: 409 }
        detail: { type: string }
        invariantRef: { type: string }
        field: { type: [string, 'null'] }
        instance: { type: [string, 'null'] }
        households:
          type: array
          minItems: 1
          maxItems: 100
          description: "Hogares de los que la persona es propietaria y que tienen otros miembros ACTIVE o mascotas compartidas. Solo ve los suyos."
          items:
            type: object
            additionalProperties: false
            required: [householdId, name, activeMembers, sharedPets]
            properties:
              householdId: { $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/Uuid' }
              name: { type: string, minLength: 1, maxLength: 100 }
              activeMembers: { type: integer, minimum: 1, description: "Otros miembros ACTIVE (sin contar a la persona)" }
              sharedPets: { type: integer, minimum: 0, description: "Mascotas de la persona asignadas a ese hogar" }
