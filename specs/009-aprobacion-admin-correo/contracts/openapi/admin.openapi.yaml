  /admin/parameters:
    get:
      tags: [admin-parameters]
      operationId: listAdminParameters
      security:
        - adminSessionCookie: []
      summary: "Catalogo de parametros en caliente: valor vigente, defecto, rango, fecha y autor de la ultima edicion [REQ-CFG9-001, REQ-CFG9-007]"
      description: >
        Solo con argos_admin_session valida; sin ella, el 404 uniforme (EDGE-009-008). Devuelve SIEMPRE las seis claves del catalogo
        cerrado del codigo (ParameterKey), en orden fijo, aunque falte la fila en platform_parameters: no hay claves nuevas desde la
        interfaz (REQ-CFG9-001). Cada elemento lleva el valor EFECTIVO (el de la fila si es valido; si la fila falta o es invalida, el
        defecto del codigo y source = DEFAULT, INV-CFG9-003, EDGE-009-014), el defecto, las restricciones del catalogo de codigo
        (constraints: rango, lista cerrada o longitud maxima; la interfaz las lee de aqui y no las duplica), si la clave es escribible
        en esta entrega (writable; las claves de la subfase 5b vienen con writable = false, P5-06 = B), la fecha de la ultima edicion
        (platform_parameters.updated_at) y el autor. El AUTOR es el id opaco del administrador de la ultima entrada de
        admin_audit_entries para esa clave; NUNCA se lee de platform_parameters.updated_by_user_id, que queda NULL en las ediciones de
        /admin (MER-09, ADR-009-08); null si nunca se edito desde /admin. Cada elemento lleva su etag para el If-Match de la escritura.
        Es lectura: no modifica estado, no renueva la inactividad y no se audita. La interfaz informa que un cambio puede tardar hasta
        1 minuto en aplicarse (REQ-CFG9-002, cache por instancia <= 60 s); el contrato no expone ese numero.
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-CFG9-001, REQ-CFG9-002, REQ-CFG9-007, REQ-CFG9-008, INV-CFG9-003, EDGE-009-008, EDGE-009-014]
