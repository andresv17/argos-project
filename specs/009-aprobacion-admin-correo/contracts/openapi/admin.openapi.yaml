      x-sdd-rbac-scope: "plataforma; PLATFORM_ADMIN nunca entra en can(rol, accion) de hogar (INV-ADM9-001)"
      x-sdd-error-order: [ERR-INTERNAL-UNEXPECTED]
      responses:
