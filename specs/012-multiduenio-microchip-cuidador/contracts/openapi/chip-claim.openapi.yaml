openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: "Argos Pet Health & Biometric Tracker API - delta de la feature 012 (microchip, reclamacion y disputa, #23)"
  version: 0.2.0
  description: >
    Documento INCREMENTAL de la feature 012 (T1630, Bloque B, #23). Archivo NUEVO: no altera lo compilado de 002..011 ni co-ownership.openapi.yaml. Sin maquina propia: las filas viven en la tabla
    owner_requests y se rigen por STATE-OWNREQ12-001 (owner-request.machine.json). La aprobacion o rechazo de una reclamacion por los propietarios, su cancelacion por el solicitante y la lectura por
    los propietarios reutilizan, SIN redefinirlas, approveOwnerRequest, rejectOwnerRequest, cancelOwnerRequest y getOwnerRequest de co-ownership.openapi.yaml. El arbitraje de disputas vive en /admin
    (admin-disputes-annex.md, T1632) y NO esta en este documento.

    SPLIT DE ERROR (REQ-CHP12-001, ENM-002-MINOR-012-CHIP): el alta y la edicion de mascota con microchipId son rutas de 004 (no se editan aqui). Su unico delta contractual es el 409: mismo dueno =
    ERR-PET-MICROCHIP-DUPLICATE (004, sin cambios); cualquier otro caso (chip de otra cuenta, fallecida incluida, o reservado por una disputa UNDER_REVIEW con o sin mascota) = 409
    ERR-CHP12-MICROCHIP-REGISTERED, componente reutilizable `MicrochipRegistered` de este documento: cuerpo y cabeceras IDENTICOS siempre y mismas llamadas al repositorio (INV-CHP12-001, INV-CHP12-009).
    Las rutas de importacion de respaldo, restauracion, /admin y semillas que escriben pets.microchip_id devuelven ese mismo 409 (microchip-error-split-annex.md).

    SIN ORACULO (INV-CHP12-003, N2-R4): createChipClaim y openChipDispute responden SIEMPRE el mismo 202 ChipRequestAccepted (sin claimId ni disputeId) para chip libre, ocupado, propio, ya pedido o sin
    reserva; solo crean fila cuando todas las precondiciones se cumplen. Ambos cuentan en los mismos tres contadores del REQ-CHP12-005 (usuario 10, IP 30, global 1000, ventana movil de 24 h, evaluados
    usuario -> IP -> global, persistidos antes de resolver y fuera de la transaccion de negocio): superado cualquiera, 429 ERR-RATE-LIMITED uniforme sea cual sea el resultado (Neo-C); el incremento es ATOMICO (insercion condicionada al conteo: si el tope esta lleno NO inserta) y un intento bloqueado por cualquier contador NO se registra en ninguno y no prolonga la ventana (alineado con el codigo vigente co-ownership-support.ts ~95; criterio CONFIRMADO por Neo, Nivel 2, 2026-11-27). Un 422 de formato
    (chip != ^[0-9]{15}$, evidencia invalida) no consulta el registro y no cuenta. El oraculo 201/409 residual del alta queda ACEPTADO por Neo (N2-R4); estos endpoints no lo amplian.

    ITERACION DRAFT 0.3 (2026-11-27; trinity H-A1, H-A4, M-1, M-2, M-4; rama F-10, F-11): (a) CANDADO SIN ORACULO: createChipClaim y openChipDispute toman SIEMPRE, antes del comprobador y sea cual sea
    el chip (exista o no mascota), (i) el candado global del UnitOfWork (pg_advisory_xact_lock, lock_timeout OWNERSHIP_LOCK_TIMEOUT_MS = 3000 ms, vigente en 1dcc063 y REQ-OWN12-011) y (ii) un candado asesor
    por chip_hmac (pg_advisory_xact_lock sobre un entero derivado del chip_hmac; SQLite: BEGIN IMMEDIATE). El agotamiento de espera de CUALQUIERA de los dos es el mismo 503 ERR-OWN12-RETRYABLE para
    todo chip. El candado por mascota (SELECT ... FOR UPDATE) se toma solo DENTRO de la rama que crea fila, ya bajo los dos anteriores, y su agotamiento NO produce 503: responde el 202 uniforme sin
    fila. (b) MULTIPART: el cuerpo se valida por cabeceras y tope de tamano antes de leerlo y el contador de peticiones multipart se consume antes de parsear (openChipDispute). (c) CONTADORES: atomicos;
    el intento bloqueado NO se registra (la insercion condicionada no inserta con el tope lleno) y la ventana no se prolonga. (d) LIMITES 409 (DISPUTE-LIMIT, DISPUTE-COOLDOWN, CLAIM-COOLDOWN) se evaluan ANTES de resolver el
    chip, solo sobre filas propias del solicitante, nunca unidos a mascotas ni reservas: mismo 409 para cualquier chip. (e) EVIDENCIA: saneo profundo (PDF activo, bomba de pixeles, reencodificacion,
    antimalware) identico para todo chip. Las erratas de texto de spec.md (REQ-OWN12-011 linea 85 y REQ-CHP12-005 linea 92) estan en errata-MINOR-bloqueB-v04.md.

    POLITICA DE 403 (H-05 de co-ownership): 403 solo por ERR-AUTH-CSRF-REJECTED. 404 uniforme ERR-PET-NOT-FOUND no se usa en estas rutas porque ninguna recibe un petId; un requestId ajeno es 404 uniforme.
    Errores en application/problem+json (RFC 9457). Cache-Control: private, no-store en todas las respuestas.
  x-sdd-status: APPROVED
  x-sdd-metadata:
    version: 0.2.0
    status: APPROVED
    supersedes: null
    change_type: MINOR
    change_note: "0.1.0 (feature 012, T1630, Architect 2026-11-27, DRAFT; el estado lo fija solo Neo): +createChipClaim (CLAIM_CO_OWNERSHIP, 202 uniforme sin claimId), +openChipDispute (CHIP_APPROPRIATION, multipart con evidencia, 202 uniforme sin disputeId), +listMyChipRequests (listado autenticado 'mis solicitudes' de chip, solo filas reales y propias), +componente MicrochipRegistered (409 uniforme del split). Sin cambios en 004 ni en co-ownership.openapi.yaml. Iteracion 0.3 (2026-11-27, DRAFT, sin aprobar): candado global y por chip_hmac siempre antes del comprobador (503 uniforme, H-A1/F-10); multipart validado por cabeceras y tope antes de parsear y contador multipart consumido antes (M-1); contadores atomicos y el intento bloqueado NO se registra (M-2, corregido en 0.4 al codigo vigente; confirmado por Neo en 0.6); limites y cooldowns 409 evaluados antes de las precondiciones sobre filas propias (M-4); saneo profundo de evidencia y antimalware (H-A4, F-11); guardado de evidencia y fila como unidad (B-5); oraculo de listMyChipRequests (H-A2) aceptado por Neo en 0.6 como residual N2-R4. Iteracion 0.4 (2026-11-27, DRAFT, sin aprobar): saneo y subida de evidencia a un area de espera ANTES de los candados (N-2); 411 declarado y ambito del contador multipart (B-N1); PDF se rechaza, no se rasteriza, antimalware por determinar y 503 ERR-OWN12-RETRYABLE (B-N2); intento bloqueado no se registra (B-N3, alineado al codigo, confirmado por Neo en 0.6); canal de tiempo del 202 (N-1) aceptado por Neo en 0.6 como residual N2-R4. Iteracion 0.5 (2026-11-27, DRAFT, sin aprobar; version alineada a 0.2.0 con error-catalog.json, oracle incidencia 3): solo se confirma la clave de evidencia bajo candado, sin copiar bytes (B-N8); el 413 por Content-Length y el 411 no cuentan en el contador multipart (B-N9); area de espera con TTL y barrido de huerfanos declarados, valor 24 h fijado por Neo en 0.6 (B-N10); los reintentos tras 503 de subida consumen intentos de chip y multipart (B-N11); el 411 usa el problema generico de la plataforma (B-N12). Errata renombrada a errata-MINOR-bloqueB-v04.md (oracle incidencia 4). Iteracion 0.6 (2026-11-27, DRAFT, sin aprobar; decisiones de Neo Nivel 2): DISPUTE_EVIDENCE_STAGING_TTL_HOURS = 24; antimalware condicion BLOQUEANTE de produccion con stub determinista en dev/CI; contador bloqueado confirmado; H-A2 y N-1 aceptados como residual N2-R4 (change_type MINOR, version 0.2.0 sin cambio). Iteracion 0.9 (2026-11-27, DRAFT, sin aprobar; rama v0.8 NUEVO-2/4): listMyChipRequests expone outcome y resolvedAt (aviso de resolucion del reclamante, sin identidad); referencias a topes multipart reasignadas a T1640 (contador) y T1641 (cuerpo, 411/413)."
    traceability: [REQ-CHP12-001, REQ-CHP12-002, REQ-CHP12-003, REQ-CHP12-004, REQ-CHP12-005, REQ-CHP12-007, REQ-CHP12-008, REQ-CHP12-010, INV-CHP12-001, INV-CHP12-003, INV-CHP12-004, INV-CHP12-007, INV-CHP12-008, INV-CHP12-009, STATE-OWNREQ12-001, EDGE-012-040, EDGE-012-044, EDGE-012-066, EDGE-012-068, SC-012-013, SC-012-014, SC-012-016, SC-012-019, SC-012-021, SC-012-097, SC-012-098, SC-012-101, SC-012-111, SC-012-112]
servers:
  - url: http://127.0.0.1:3100/api
    description: Servidor local (prefijo /api)
security:
  - sessionCookie: []
tags:
  - name: chip-claims
  - name: chip-disputes

paths:
  /chip-claims:
    post:
      tags: [chip-claims]
      operationId: createChipClaim
      summary: "Solicita co-propiedad sobre un chip ya registrado (CLAIM_CO_OWNERSHIP); 202 uniforme sin claimId [REQ-CHP12-003, INV-CHP12-003]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-CHP12-003, REQ-CHP12-005, INV-CHP12-003, INV-CHP12-008, EDGE-012-040, SC-012-016, SC-012-101]
      description: >
        Se invoca desde el dialogo del 409 ERR-CHP12-MICROCHIP-REGISTERED. Orden fijo: (1) CSRF y sesion; (2) formato (422, no cuenta); (3) se cuenta el intento (REQ-CHP12-005) ANTES de resolver el chip; (4) se toman SIEMPRE el candado global del UnitOfWork y el candado asesor por chip_hmac (agotamiento = 503 uniforme para cualquier chip, H-A1); (5) cooldown propio (409, mas abajo) sobre filas propias; (6) comprobador y resolucion. El servidor responde el MISMO 202 ChipRequestAccepted en todos
        estos casos, sin crear fila salvo el ultimo: (a) chip inexistente y sin reserva; (b) chip de una mascota propia del solicitante (principal o co-propietario INVITED/ACTIVE: para eso existe
        ERR-PET-MICROCHIP-DUPLICATE en el alta); (c) ya existe una solicitud PENDING del mismo (solicitante, chip_hmac) (idempotente, no duplica ni renueva el TTL); (d) chip reservado por una
        disputa sin mascota viva; (e) tope MAX_CO_OWNERS_PER_PET ya alcanzado en la mascota (se revalida al aprobar, no se anticipa con un error distinto). Solo cuando el chip pertenece a una mascota
        viva ajena y no hay PENDING previa se crea la fila (action CLAIM_CO_OWNERSHIP, chip_hmac y chip_last4, TTL CHIP_CLAIM_TTL_DAYS = 14, estado PENDING, sellando approver_set = propietarios ACTIVE).
        El solicitante NO recibe acceso ni datos de la mascota mientras sea PENDING; los propietarios ven su username y su mensaje (<= 280) por getOwnerRequest. El unico error propio posible es
        409 ERR-CHP12-CLAIM-COOLDOWN: cooldown CHIP_CLAIM_COOLDOWN_DAYS = 30 tras un REJECTED de ESTE solicitante sobre ESTE chip_hmac (ancla por chip, no por mascota). Iteracion 0.3 (trinity M-4): se evalua
        ANTES de resolver el chip, solo sobre las filas propias del solicitante y SIN unirlas a mascotas ni reservas; sigue siendo 409 aunque la mascota ya no exista (fila huerfana), de modo que no distingue
        chips y no revela nada a un tercero. Sin disputa: la aprobacion revalida bajo el bloqueo por mascota el tope y la congelacion (ERR-OWN12-CO-OWNER-LIMIT,
        ERR-CHP12-CHIP-FROZEN, en el voto, no aqui). Auditoria sin chip completo (REQ-CHP12-007).
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/chip-claim.schema.json#/$defs/CreateChipClaimRequest' }
      responses:
        '202':
          description: "Recibido. Cuerpo y cabeceras identicos exista o no la fila (sin claimId)"
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '../schemas/chip-claim.schema.json#/$defs/ChipRequestAccepted' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '409':
          description: "ERR-CHP12-CLAIM-COOLDOWN (unico 409 posible)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '422':
          description: "ERR-SCHEMA-VALIDATION-FAILED: chip != ^[0-9]{15}$, mensaje invalido o cuerpo con campos extra; sin consulta al registro y NO cuenta como intento"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: "ERR-OWN12-RETRYABLE: espera acotada agotada sobre el candado global del UnitOfWork o el candado asesor por chip_hmac, tomados SIEMPRE antes del comprobador (REQ-OWN12-011, trinity H-A1, rama F-10); misma respuesta, misma cabecera Retry-After constante y mismo codigo para chip existente o inexistente; nunca por el candado por mascota"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /chip-disputes:
    post:
      tags: [chip-disputes]
      operationId: openChipDispute
      summary: "Abre una disputa por apropiacion (CHIP_DISPUTE, CHIP_APPROPRIATION) con evidencia documental; 202 uniforme sin disputeId [REQ-CHP12-004, INV-CHP12-009]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-CHP12-004, REQ-CHP12-005, REQ-CHP12-008, INV-CHP12-003, INV-CHP12-004, INV-CHP12-009, EDGE-012-066, SC-012-019, SC-012-020, SC-012-097, SC-012-098, SC-012-111]
      description: >
        «Esta mascota es mia y no coincide / alguien se apropio». multipart/form-data: microchipId + 1..5 evidencias (REQ-CHP12-008). Orden fijo (iteracion 0.3): (1) CSRF y sesion; (2) CABECERAS Y TOPE ANTES DE LEER EL CUERPO (trinity M-1):
        Content-Type multipart/form-data con boundary, Content-Length obligatorio y <= CHIP_DISPUTE_BODY_MAX_BYTES (413 por cuerpo, ademas del tope por archivo de 004; cuerpo sin Content-Length o con Transfer-Encoding chunked: 411, problema generico de 004, antes de leer el cuerpo y sin consumir el contador multipart; 411 usa el problema generico de la plataforma, sin esquema propio, trinity B-N12);
        independiente del chip y no cuenta como chip; (3) se CONSUME el contador de peticiones multipart (ambito CHIP_MULTIPART: por usuario en rate_limit_events y por IP HMAC en ip_rate_events, ver data-model.md; usuario -> IP, mismos limites que REQ-CHP12-005; atomico) ANTES de parsear: superado,
        429 uniforme; el contador cuenta TODA peticion multipart que llega a este paso, incluso las que luego dan 422 o el 413 por archivo del paso 4 (el 413 por Content-Length y el 411 se deciden en el paso 2, antes del contador, y NO cuentan, trinity B-N9); (4) parseo en streaming con limites de parser (maximo 1 + DISPUTE_EVIDENCE_MAX_FILES
        partes, un solo campo microchipId, partes desconocidas rechazadas, abortar al exceder el tope), validacion de forma SIN tocar el registro (chip ^[0-9]{15}$, tipos y firma de contenido, tamanos,
        1..5 archivos): 422 independiente del chip, no cuenta en los contadores de chip; (5) SANEO PROFUNDO de TODA evidencia valida, identico para cualquier chip (REQ-CHP12-008, trinity H-A4, rama F-11):
        imagenes decodificadas con limite de pixeles (DISPUTE_EVIDENCE_MAX_PIXELS = 16000000, 16 MP, fijado por Neo) y reencodificadas (descarta EXIF, XMP y cola de datos poliglota), PDF sin JavaScript, Launch, OpenAction, acciones adicionales, XFA, archivos embebidos ni
        metadatos activos (se RECHAZA con 422; NO se rasteriza, trinity B-N2), y analisis antimalware ANTES de subir al area de espera (producto ClamAV detras de MalwareScannerPort, sidecar sin dependencia npm nueva, fijado por Neo, Nivel 2, 2026-11-27; su aprovisionamiento es condicion BLOQUEANTE de release en produccion junto con DEUDA-012-LEGAL-DISPUTAS-QR; en dev/CI se usa un adaptador determinista sin llamadas externas); el rechazo es 422 ERR-SCHEMA-VALIDATION-FAILED independiente del chip y si el antimalware no esta
        disponible falla cerrada con 503 ERR-OWN12-RETRYABLE (mismo cuerpo y Retry-After constante que el de los candados); (6) se cuenta el intento de chip (REQ-CHP12-005; atomico; el intento bloqueado NO se registra) y, si algun
        contador esta superado, 429 uniforme; si ninguno lo bloquea, se SUBEN los archivos ya saneados a un AREA DE ESPERA del almacen (clave no derivable, sin fila y sin asociar a chip alguno, igual para cualquier chip), SIEMPRE ANTES de tomar cualquier candado (trinity N-2); (7) se toman SIEMPRE el candado global del UnitOfWork y el candado asesor por chip_hmac (agotamiento = 503 uniforme, H-A1); ORDEN DECLARADO (trinity N-2): el saneo (paso 5), el antimalware y la subida al area de espera (paso 6) terminan ANTES de este paso, de modo que un 503 de subida o de antimalware NO retiene ningun candado y no puede bloquear salida, sucesion ni votos de terceros; bajo los candados NO se escriben bytes en el almacen; (8) LIMITES (trinity M-4), evaluados
        ANTES de las precondiciones y solo sobre filas propias del solicitante (sin unir a mascotas ni reservas): 1 disputa abierta por (usuario, chip_hmac) y MAX_OPEN_DISPUTES_PER_USER = 3 simultaneas
        contando todas las clases (409 ERR-CHP12-DISPUTE-LIMIT) y cooldown de 90 dias tras un REJECT de /admin por (solicitante, chip) (409 ERR-CHP12-DISPUTE-COOLDOWN; el cierre sin efecto y el
        vencimiento EXPIRED no lo activan): mismo 409 para cualquier chip, exista o no; (9) PRECONDICIONES de apertura (trinity C-2, B-3): el solicitante no es principal ni co-propietario INVITED/ACTIVE de una
        mascota con ese chip, y el chip tiene mascota registrada o reserva vigente; si alguna falla, el MISMO 202 ChipRequestAccepted SIN crear fila y sin asociar ningun archivo (los del area de espera se encolan en media_deletion_queue tras liberar los candados (tambien tras un 503 de subida, lo ya subido se encola); no acapara chips inexistentes,
        no es oraculo, no congela una mascota propia); (10) SOLO entonces, y dentro de una sola unidad de trabajo, se toma el candado por mascota, se REGISTRA la clave de la evidencia ya saneada y subida (operacion de metadatos: SOLO confirmar la clave definitiva de lo ya subido al area de espera, sin copiar ni mover bytes bajo candado, trinity B-N8; clave de almacen no derivable)
        y se crea la fila en UNDER_REVIEW (no hay PENDING ni aprobacion de propietarios: nace en revision de /admin), con frozen_until = created_at + 30 dias, expires_at = created_at + DISPUTE_MAX_OPEN_DAYS (60),
        SLA de 15 dias habiles, congelacion por chip y reserva del chip (INV-CHP12-005, INV-CHP12-009). Registro de claves y fila son una unidad (insercion condicionada: la fila solo se inserta si se cumplen todas las precondiciones; si no se crea, por carrera con el limite o fallo, los objetos
        ya subidos se encolan para borrado en media_deletion_queue, trinity B-5). AREA DE ESPERA (trinity B-N10): los objetos llevan TTL (DISPUTE_EVIDENCE_STAGING_TTL_HOURS = 24, fijado por Neo, Nivel 2, 2026-11-27) y un barrido de huerfanos sobre el prefijo del area de espera borra lo que quede sin fila ni encolado (caida entre subida y encolado). REINTENTOS (trinity B-N11): un reintento tras un 503 de subida o antimalware vuelve a pasar por los pasos 3 y 6 y consume de nuevo intento multipart y de chip (no se devuelven); el valor de CHIP_MULTIPART_MAX_PER_USER_PER_DAY debe considerarlo en T1640 (rama NUEVO-4). El canal de TIEMPO entre el 202 con fila y el 202 sin fila (trinity N-1) queda reducido por este orden pero no eliminado: ACEPTADO por Neo (Nivel 2, 2026-11-27) como residual N2-R4, consistente con la igualdad estructural de llamadas y el candado chip_hmac previo. Ninguna ruta transfiere propiedad.
        Los propietarios actuales reciben un aviso DERIVADO en la aplicacion («se abrio un caso de revision sobre el microchip terminado en {ultimos 4} de una de tus mascotas»), sin cuenta, hogar,
        nombre de mascota, fecha ni evidencia del reclamante (Neo-K, INV-CHP12-007); no hay correo ni tabla de notificaciones. Los propietarios NO ven la evidencia. Auditoria sin chip completo
        (REQ-CHP12-007). El reclamante sigue su caso por listMyChipRequests. Un reclamante NO cancela una disputa abierta (la resuelve /admin; salida sin efecto solo por moot_reason).
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '../schemas/chip-claim.schema.json#/$defs/OpenChipDisputeForm' }
            encoding:
              evidence:
                contentType: application/pdf, image/jpeg, image/png, image/webp
      responses:
        '202':
          description: "Recibido. Cuerpo y cabeceras identicos exista o no la fila (sin disputeId)"
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '../schemas/chip-claim.schema.json#/$defs/ChipRequestAccepted' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }
        '409':
          description: "ERR-CHP12-DISPUTE-LIMIT o ERR-CHP12-DISPUTE-COOLDOWN; se evaluan ANTES de las precondiciones (paso 8), solo sobre filas propias del solicitante y con la misma respuesta para cualquier chip (trinity M-4)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '411':
          description: "Cuerpo multipart sin Content-Length (o con Transfer-Encoding chunked): rechazado antes de leer el cuerpo y antes del contador multipart (no cuenta); independiente del chip (trinity B-N1). Trinity B-N12: 004 NO define un problema especifico para 411 (verificado por lectura de specs/004); este 411 usa el problema generico de la plataforma (ProblemDetails de common.schema.json, application/problem+json) sin esquema ni codigo de error propios; no se inventa esquema aqui, confirmar en T1641 (rama NUEVO-4)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '413':
          description: "Cuerpo por encima de CHIP_DISPUTE_BODY_MAX_BYTES (decidido por la cabecera Content-Length ANTES de leer el cuerpo y del contador multipart: no cuenta, trinity B-N9) o archivo por encima del tope de bytes de 004 (ARGOS_MEDIA_MAX_BYTES / cuota); problema generico de 004, independiente del chip"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '422':
          description: "ERR-SCHEMA-VALIDATION-FAILED: chip invalido, 0 o mas de 5 archivos, tipo o firma no permitidos (SVG, HTML), partes duplicadas o desconocidas, imagen que supera el limite de pixeles, PDF con contenido activo o archivos embebidos (rechazado, no rasterizado), malware detectado; independiente del chip y NO cuenta en los contadores de chip (SI en el de peticiones multipart)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: "ERR-OWN12-RETRYABLE: espera agotada sobre el candado global del UnitOfWork o el candado asesor por chip_hmac (tomados siempre), o antimalware o subida al area de espera no disponibles (falla cerrada, ANTES de tomar candados); Retry-After constante, identico para cualquier chip"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /chip-requests:
    get:
      tags: [chip-claims, chip-disputes]
      operationId: listMyChipRequests
      summary: "Listado autenticado «mis solicitudes» de chip: reclamaciones y disputas propias [REQ-CHP12-003, REQ-CHP12-004, lock R-11]"
      x-sdd-change: NEW
      x-sdd-requirements: [REQ-CHP12-003, REQ-CHP12-004, INV-CHP12-003, INV-CHP12-007, SC-012-101]
      description: >
        Unico canal por el que el solicitante descubre el id y el estado de lo que envio (los POST no devuelven ids). Solo filas REALES cuyo solicitante es el usuario autenticado, de las acciones
        CLAIM_CO_OWNERSHIP y CHIP_DISPUTE (CHIP_APPROPRIATION); un 202 sin fila no deja rastro. RESIDUAL ACEPTADO por Neo (trinity H-A2, Nivel 2, 2026-11-27, N2-R4): una fila solo existe si el chip pertenece a una mascota VIVA AJENA (CLAIM) o a una mascota o reserva vigente (disputa), asi que
        la AUSENCIA o PRESENCIA de la fila tras enviar un intento ES un oraculo de existencia (mayor que el 201/409 aceptado en N2-R4: distingue viva de fallecida) y se retira la afirmacion previa de que
        «el listado nunca prueba que un chip exista». Neo eligio (A) (2026-11-27): aceptarlo en N2-R4 como oraculo residual acotado (el solicitante ya conoce el chip que envio, sin identidad ajena) y mitigado por los contadores de REQ-CHP12-005; no se redisena. Cada fila lleva solo chipLast4 y estado; omite
        mascota, propietarios, hogar, fechas ajenas y evidencia (ChipRequestView). Paginado por cursor estable (limit <= 100). Para cancelar una CLAIM PENDING el solicitante usa cancelOwnerRequest de
        co-ownership.openapi.yaml; una CHIP_DISPUTE no se cancela. Las PENDING con expires_at <= now se devuelven EXPIRED. Las disputas por ausencia (sin chip) NO aparecen aqui sino en listMyOwnerRequests.
        AVISO DE RESOLUCION (rama N-C y NUEVO-2, Neo 2026-11-27; REQ-CHP12-010, admin-disputes-annex.md §9): para una CHIP_DISPUTE terminal, cada fila lleva `outcome` (RESOLVED_APPROVED, RESOLVED_REJECTED o EXPIRED; ChipRequestOutcome) y `resolvedAt` (= closed_at, tambien en EXPIRED; DisputeResolutionNotice de admin-disputes.schema.json reutiliza el mismo enum), ambos null mientras UNDER_REVIEW y en CLAIM_CO_OWNERSHIP; nunca la identidad de la otra parte ni del arbitro ni el motivo.
        Cache-Control: private, no-store.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 256 } }
      responses:
        '200':
          description: "Solicitudes de chip del usuario"
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '../schemas/chip-claim.schema.json#/$defs/ChipRequestList' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: argos_session
      description: Cookie de sesion de usuario de 001/002 (nunca la de /admin).
  parameters:
    CsrfHeader:
      name: X-Argos-Request
      in: header
      required: true
      description: Obligatoria en toda peticion que modifica estado; si falta, ERR-AUTH-CSRF-REJECTED (INV-AUTH-007)
      schema: { type: string, const: '1' }
  responses:
    CsrfForbidden:
      description: "403 SOLO por ERR-AUTH-CSRF-REJECTED (falta X-Argos-Request)"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem:
      description: Error tipado del catalogo contracts/errors/error-catalog.json (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    RateLimited:
      description: "429 ERR-RATE-LIMITED UNIFORME (REQ-CHP12-005, Neo-C): cuerpo y cabeceras identicos por usuario, IP o global y sea cual sea el resultado que habria tenido el intento (chip libre, ocupado, propio, reservado, inexistente); si el almacen de limites falla, el mismo 429 (falla cerrada). Retry-After constante, sin indicar el contador ni el tiempo restante"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    MicrochipRegistered:
      description: >
        409 ERR-CHP12-MICROCHIP-REGISTERED («Este microchip ya esta registrado»). Componente que referencian las rutas de ESCRITURA de pets.microchip_id (alta y edicion de 004; importacion de respaldo,
        restauracion, /admin y semillas): cuerpo y cabeceras IDENTICOS para chip ocupado por otra cuenta (fallecida incluida), reservado por una disputa UNDER_REVIEW con mascota y reservado sin mascota
        (SC-012-097, SC-012-112); sin nombre, dueno, hogar, fecha, numero de co-propietarios, estado de la mascota ni indicacion de que chip choco en una importacion; mismas llamadas al repositorio
        (INV-CHP12-001). Mismo dueno: NO es este componente sino ERR-PET-MICROCHIP-DUPLICATE (004).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: urn:argos:error:ERR-CHP12-MICROCHIP-REGISTERED
            title: Este microchip ya está registrado
            status: 409
            detail: Ese número de microchip no se puede usar en este registro. Si crees que corresponde a tu mascota, puedes solicitar co-propiedad o abrir una reclamación.
  schemas:
    ProblemDetails:
      $ref: 'https://argos.local/contracts/schemas/common.schema.json#/$defs/ProblemDetails'
